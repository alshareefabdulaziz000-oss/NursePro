<!DOCTYPE html>

<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>NursePro — Nursing Procedures</title>
<style>
:root{
  --navy:#0b2444;--navy2:#163560;
  --teal:#0e7c6e;--teal2:#14a897;
  --w:#fff;--off:#f7f9fb;
  --g1:#eef1f6;--g2:#dce2ec;--g4:#94a3b8;--g6:#4b5f7a;--g8:#1e2d42;
}
*,*::before,*::after{margin:0;padding:0;box-sizing:border-box}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',system-ui,sans-serif;background:var(--off);color:var(--g8);min-height:100vh}
header{background:linear-gradient(135deg,var(--navy),var(--navy2) 60%,#1a4a7a);position:sticky;top:0;z-index:200;box-shadow:0 2px 20px rgba(11,36,68,.5)}
.hi{max-width:1440px;margin:auto;padding:14px 20px;display:flex;align-items:center;gap:14px;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:11px;flex-shrink:0}
.logo{width:46px;height:46px;background:linear-gradient(135deg,var(--teal),var(--teal2));border-radius:12px;display:flex;align-items:center;justify-content:center;font-size:16px;font-weight:900;color:#fff;box-shadow:0 4px 14px rgba(14,124,110,.45)}
.bn{font-size:1.3rem;font-weight:800;color:#fff;line-height:1}
.bs{font-size:.65rem;color:rgba(255,255,255,.5);letter-spacing:.7px;margin-top:2px}
.sb{flex:1;max-width:480px;position:relative}
.sb input{width:100%;padding:10px 14px 10px 40px;border-radius:11px;border:1.5px solid rgba(255,255,255,.18);background:rgba(255,255,255,.12);color:#fff;font-size:.88rem;outline:none;transition:.2s;font-family:inherit}
.sb input::placeholder{color:rgba(255,255,255,.45)}
.sb input:focus{border-color:var(--teal2);background:rgba(255,255,255,.18)}
.si{position:absolute;left:12px;top:50%;transform:translateY(-50%);color:rgba(255,255,255,.5);pointer-events:none;font-size:.9rem}
.hm{display:flex;gap:10px;margin-right:auto}
.chip{background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.15);border-radius:8px;padding:4px 12px;text-align:center}
.chip strong{display:block;font-size:.95rem;font-weight:700;color:var(--teal2)}
.chip small{font-size:.58rem;color:rgba(255,255,255,.55);letter-spacing:.5px}
.cs{background:var(--w);border-bottom:2px solid var(--g1);overflow-x:auto;scrollbar-width:none}
.cs::-webkit-scrollbar{display:none}
.ci{max-width:1440px;margin:auto;padding:8px 20px;display:flex;gap:5px;white-space:nowrap}
.cb{padding:6px 12px;border-radius:30px;border:1.5px solid var(--g2);background:transparent;color:var(--g6);font-size:.76rem;font-weight:600;cursor:pointer;transition:.18s;white-space:nowrap;font-family:inherit}
.cb:hover{border-color:var(--teal);color:var(--teal)}
.cb.active{background:var(--navy);border-color:var(--navy);color:#fff}
main{max-width:1440px;margin:auto;padding:22px 20px}
.ph{display:flex;align-items:baseline;justify-content:space-between;flex-wrap:wrap;gap:6px;margin-bottom:16px}
.pt{font-size:1.2rem;font-weight:800;color:var(--navy)}
.pc{font-size:.78rem;color:var(--g4);font-weight:500}
.pc strong{color:var(--teal)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:14px}
.card{background:var(--w);border-radius:14px;border:1.5px solid var(--g1);overflow:hidden;cursor:pointer;transition:transform .2s,box-shadow .2s}
.card:hover{transform:translateY(-2px);box-shadow:0 8px 28px rgba(11,36,68,.1)}
.ct{height:4px}
.cb2{padding:15px 17px}
.ch{display:flex;align-items:flex-start;gap:11px;margin-bottom:11px}
.ci2{width:40px;height:40px;border-radius:10px;display:flex;align-items:center;justify-content:center;font-size:1.2rem;flex-shrink:0}
.ctt{font-size:.92rem;font-weight:700;color:var(--navy);line-height:1.3}
.ctag{display:inline-block;margin-top:3px;font-size:.62rem;font-weight:700;letter-spacing:.3px;text-transform:uppercase;padding:2px 7px;border-radius:20px}
.csteps{list-style:none;display:flex;flex-direction:column;gap:5px}
.csteps li{display:flex;align-items:flex-start;gap:7px;font-size:.78rem;color:var(--g6);line-height:1.5}
.sn{width:18px;height:18px;border-radius:50%;flex-shrink:0;margin-top:2px;display:flex;align-items:center;justify-content:center;font-size:.57rem;font-weight:800;color:#fff}
.more{font-size:.7rem;font-weight:700;padding-left:25px}
.cf{display:flex;align-items:center;gap:5px;flex-wrap:wrap;margin-top:11px;padding-top:10px;border-top:1px solid var(--g1)}
.tag{font-size:.62rem;font-weight:700;padding:2px 7px;border-radius:20px}
.tb{background:#dbeafe;color:#1e40af}
.tr{background:#fee2e2;color:#991b1b}
.tgr{background:var(--g1);color:var(--g6)}
.ov{position:fixed;inset:0;background:rgba(11,36,68,.72);backdrop-filter:blur(4px);z-index:500;display:none;align-items:center;justify-content:center;padding:16px}
.ov.open{display:flex}
.mo{background:var(--w);border-radius:18px;width:100%;max-width:680px;max-height:92vh;overflow-y:auto;animation:su .25s ease}
@keyframes su{from{opacity:0;transform:translateY(20px)}to{opacity:1;transform:translateY(0)}}
.mh{padding:18px 22px 14px;border-bottom:2px solid var(--g1);position:sticky;top:0;background:var(--w);border-radius:18px 18px 0 0;display:flex;align-items:center;gap:12px}
.mic{width:46px;height:46px;border-radius:12px;display:flex;align-items:center;justify-content:center;font-size:1.4rem;flex-shrink:0}
.mt{font-size:1.1rem;font-weight:800;color:var(--navy)}
.mcat{font-size:.67rem;font-weight:700;margin-top:2px;letter-spacing:.3px}
.mcl{margin-right:auto;width:30px;height:30px;border-radius:7px;border:1.5px solid var(--g2);background:transparent;cursor:pointer;font-size:.9rem;color:var(--g4);display:flex;align-items:center;justify-content:center;flex-shrink:0;font-family:inherit}
.mcl:hover{background:var(--g1)}
.mb{padding:18px 22px}
.ms{margin-bottom:18px}
.mst{font-size:.63rem;font-weight:800;letter-spacing:1.6px;text-transform:uppercase;color:var(--g4);margin-bottom:9px;display:flex;align-items:center;gap:6px}
.mst::after{content:'';flex:1;height:1px;background:var(--g1)}
.ib{border-radius:9px;padding:10px 12px;font-size:.83rem;line-height:1.6;display:flex;align-items:flex-start;gap:8px;margin-bottom:7px}
.ib .ii{font-size:.88rem;flex-shrink:0;margin-top:1px}
.ibi{background:#eff6ff;border:1.5px solid #bfdbfe;color:#1e40af}
.ibw{background:#fffbeb;border:1.5px solid #fde68a;color:#78350f}
.ibs{background:#f0fdf4;border:1.5px solid #bbf7d0;color:#14532d}
.eg{display:flex;flex-wrap:wrap;gap:5px}
.ec{background:var(--g1);border-radius:6px;padding:4px 9px;font-size:.75rem;font-weight:500;color:var(--g6)}
.sol{list-style:none;display:flex;flex-direction:column;gap:8px}
.sol li{display:flex;align-items:flex-start;gap:10px;font-size:.84rem;color:var(--g6);line-height:1.6}
.sc{width:24px;height:24px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:.63rem;font-weight:800;color:#fff;flex-shrink:0;margin-top:2px}
.rb{background:var(--off);border-radius:9px;padding:12px 14px}
.ri{font-size:.74rem;color:var(--g6);line-height:1.7;padding-left:14px;position:relative;margin-bottom:3px}
.ri::before{content:'•';position:absolute;left:2px;color:var(--teal)}
.nr{grid-column:1/-1;text-align:center;padding:60px 20px;color:var(--g4)}
.loading{grid-column:1/-1;text-align:center;padding:60px 20px;color:var(--g4);font-size:1rem}
@media(max-width:640px){
  .hi{padding:11px 14px;gap:10px}.bn{font-size:1.1rem}.hm{display:none}
  main{padding:12px 14px}.grid{grid-template-columns:1fr}.mh,.mb{padding:14px}
}
</style>
</head>
<body>

<header>
  <div class="hi">
    <div class="brand">
      <div class="logo">Nρ</div>
      <div><div class="bn">NursePro</div><div class="bs">Evidence-Based Nursing Procedures</div></div>
    </div>
    <div class="sb">
      <span class="si">🔍</span>
      <input type="text" id="searchInput" placeholder="Search procedures…" autocomplete="off"/>
    </div>
    <div class="hm">
      <div class="chip"><strong id="tP">—</strong><small>PROCEDURES</small></div>
      <div class="chip"><strong id="tC">—</strong><small>CATEGORIES</small></div>
    </div>
  </div>
</header>

<div class="cs"><div class="ci" id="catBar"></div></div>

<main>
  <div class="ph"><div class="pt" id="pgTitle">All Procedures</div><div class="pc" id="pgCount"></div></div>
  <div class="grid" id="grid"><div class="loading">Loading procedures…</div></div>
</main>

<div class="ov" id="overlay">
  <div class="mo" id="modal">
    <div class="mh">
      <div class="mic" id="mIco"></div>
      <div><div class="mt" id="mTit"></div><div class="mcat" id="mCat"></div></div>
      <button class="mcl" id="closeBtn">✕</button>
    </div>
    <div class="mb" id="mBod"></div>
  </div>
</div>

<script src="data.js"></script>

<script>
var curCat='all', srch='';

function getCat(id){
  for(var i=0;i<CATS.length;i++) if(CATS[i].id===id) return CATS[i];
  return {icon:'📋',label:'General',color:'#374151',bg:'#f9fafb'};
}

function buildBar(){
  var bar=document.getElementById('catBar');
  bar.innerHTML='';
  var allBtn=document.createElement('button');
  allBtn.className='cb active';
  allBtn.textContent='All Procedures';
  allBtn.setAttribute('data-cat','all');
  bar.appendChild(allBtn);
  for(var i=0;i<CATS.length;i++){
    var c=CATS[i];
    var btn=document.createElement('button');
    btn.className='cb';
    btn.textContent=c.icon+' '+c.label;
    btn.setAttribute('data-cat',c.id);
    bar.appendChild(btn);
  }
  document.getElementById('tP').textContent=PROCS.length;
  document.getElementById('tC').textContent=CATS.length;
}

document.getElementById('catBar').addEventListener('click',function(e){
  var btn=e.target.closest('.cb');
  if(!btn) return;
  var btns=document.querySelectorAll('.cb');
  for(var i=0;i<btns.length;i++) btns[i].classList.remove('active');
  btn.classList.add('active');
  curCat=btn.getAttribute('data-cat');
  render();
});

function render(){
  var grid=document.getElementById('grid');
  var list=[];
  for(var i=0;i<PROCS.length;i++){
    var p=PROCS[i];
    if(curCat!=='all' && p.cat!==curCat) continue;
    if(srch){
      var s=srch.toLowerCase();
      var found=p.title.toLowerCase().indexOf(s)>=0 ||
                (p.summary||'').toLowerCase().indexOf(s)>=0;
      if(!found){
        for(var j=0;j<(p.steps||[]).length;j++){
          if(p.steps[j].toLowerCase().indexOf(s)>=0){found=true;break;}
        }
      }
      if(!found) continue;
    }
    list.push(p);
  }

  var ct=getCat(curCat==='all'?null:curCat);
  document.getElementById('pgTitle').textContent=curCat==='all'?'All Procedures':ct.label;
  document.getElementById('pgCount').innerHTML='Showing <strong>'+list.length+'</strong> procedure'+(list.length!==1?'s':'');

  if(list.length===0){
    grid.innerHTML='<div class="nr">🔍 No procedures match your search.</div>';
    return;
  }

  var html='';
  for(var i=0;i<list.length;i++){
    var p=list[i];
    var ct2=getCat(p.cat);
    var s3=p.steps.slice(0,3);
    var stepsHtml='';
    for(var j=0;j<s3.length;j++){
      stepsHtml+='<li><span class="sn" style="background:'+ct2.color+'">'+( j+1)+'</span><span>'+s3[j]+'</span></li>';
    }
    if(p.steps.length>3){
      stepsHtml+='<li><span class="more" style="color:'+ct2.color+'">+'+(p.steps.length-3)+' more steps</span></li>';
    }
    html+='<div class="card" data-id="'+p.id+'">';
    html+='<div class="ct" style="background:'+ct2.color+'"></div>';
    html+='<div class="cb2">';
    html+='<div class="ch"><div class="ci2" style="background:'+ct2.bg+';color:'+ct2.color+'">'+p.icon+'</div>';
    html+='<div><div class="ctt">'+p.title+'</div>';
    html+='<span class="ctag" style="background:'+ct2.bg+';color:'+ct2.color+'">'+ct2.icon+' '+ct2.label+'</span></div></div>';
    html+='<ul class="csteps">'+stepsHtml+'</ul>';
    html+='<div class="cf">';
    html+='<span class="tag tgr">📚 Evidence-Based</span>';
    if(p.warnings && p.warnings.length) html+='<span class="tag tr">⚠️ Alerts</span>';
    html+='<span class="tag tb">'+p.steps.length+' steps</span>';
    html+='</div></div></div>';
  }
  grid.innerHTML=html;
}

document.getElementById('grid').addEventListener('click',function(e){
  var card=e.target.closest('.card');
  if(!card) return;
  openModal(parseInt(card.getAttribute('data-id')));
});

function openModal(id){
  var p=null;
  for(var i=0;i<PROCS.length;i++) if(PROCS[i].id===id){p=PROCS[i];break;}
  if(!p) return;
  var ct=getCat(p.cat);

  document.getElementById('mIco').textContent=p.icon;
  document.getElementById('mIco').style.background=ct.bg;
  document.getElementById('mIco').style.color=ct.color;
  document.getElementById('mTit').textContent=p.title;
  document.getElementById('mCat').innerHTML='<span style="color:'+ct.color+'">'+ct.icon+' '+ct.label+'</span>';

  var h='';
  h+='<div class="ms"><div class="ib ibi"><span class="ii">ℹ️</span><span>'+p.summary+'</span></div></div>';

  if(p.equipment && p.equipment.length){
    h+='<div class="ms"><div class="mst">🧰 Equipment Required</div><div class="eg">';
    for(var i=0;i<p.equipment.length;i++) h+='<span class="ec">✅ '+p.equipment[i]+'</span>';
    h+='</div></div>';
  }

  h+='<div class="ms"><div class="mst">📋 Step-by-Step Procedure</div><ol class="sol">';
  for(var i=0;i<p.steps.length;i++){
    h+='<li><span class="sc" style="background:'+ct.color+'">'+(i+1)+'</span><span>'+p.steps[i]+'</span></li>';
  }
  h+='</ol></div>';

  if(p.warnings && p.warnings.length){
    h+='<div class="ms"><div class="mst">⚠️ Clinical Warnings</div>';
    for(var i=0;i<p.warnings.length;i++) h+='<div class="ib ibw"><span class="ii">⚠️</span><span>'+p.warnings[i]+'</span></div>';
    h+='</div>';
  }

  if(p.notes && p.notes.length){
    h+='<div class="ms"><div class="mst">💡 Clinical Notes</div>';
    for(var i=0;i<p.notes.length;i++) h+='<div class="ib ibs"><span class="ii">💡</span><span>'+p.notes[i]+'</span></div>';
    h+='</div>';
  }

  if(p.refs && p.refs.length){
    h+='<div class="ms"><div class="mst">📚 References</div><div class="rb">';
    for(var i=0;i<p.refs.length;i++) h+='<div class="ri">'+p.refs[i]+'</div>';
    h+='</div></div>';
  }

  document.getElementById('mBod').innerHTML=h;
  document.getElementById('overlay').classList.add('open');
  document.body.style.overflow='hidden';
  document.getElementById('modal').scrollTop=0;
}

document.getElementById('overlay').addEventListener('click',function(e){
  if(e.target===this) closeModal();
});
document.getElementById('closeBtn').addEventListener('click',closeModal);
document.addEventListener('keydown',function(e){if(e.key==='Escape') closeModal();});

function closeModal(){
  document.getElementById('overlay').classList.remove('open');
  document.body.style.overflow='';
}

document.getElementById('searchInput').addEventListener('input',function(){
  srch=this.value.trim();
  render();
});

buildBar();
render();
</script>

</body>
</html>
