<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>NursePro</title>
<style>
:root{--navy:#0b2444;--navy2:#163560;--teal:#0e7c6e;--teal2:#14a897;--w:#fff;--off:#f7f9fb;--g1:#eef1f6;--g2:#dce2ec;--g4:#94a3b8;--g6:#4b5f7a;--g8:#1e2d42}
*,*::before,*::after{margin:0;padding:0;box-sizing:border-box}
body{font-family:-apple-system,BlinkMacSystemFont,system-ui,sans-serif;background:var(--off);color:var(--g8)}
header{background:linear-gradient(135deg,var(--navy),var(--navy2) 60%,#1a4a7a);position:sticky;top:0;z-index:200;box-shadow:0 2px 20px rgba(11,36,68,.5)}
.hi{max-width:1400px;margin:auto;padding:13px 18px;display:flex;align-items:center;gap:13px;flex-wrap:wrap}
.logo{width:44px;height:44px;background:linear-gradient(135deg,var(--teal),var(--teal2));border-radius:11px;display:flex;align-items:center;justify-content:center;font-size:15px;font-weight:900;color:#fff;flex-shrink:0}
.bn{font-size:1.25rem;font-weight:800;color:#fff;line-height:1}
.bs{font-size:.63rem;color:rgba(255,255,255,.5);letter-spacing:.6px;margin-top:2px}
.sb{flex:1;max-width:460px;position:relative}
.sb input{width:100%;padding:9px 13px 9px 38px;border-radius:10px;border:1.5px solid rgba(255,255,255,.18);background:rgba(255,255,255,.12);color:#fff;font-size:.86rem;outline:none;font-family:inherit}
.sb input::placeholder{color:rgba(255,255,255,.45)}
.sb input:focus{border-color:var(--teal2);background:rgba(255,255,255,.18)}
.si{position:absolute;left:11px;top:50%;transform:translateY(-50%);color:rgba(255,255,255,.5);pointer-events:none}
.hm{display:flex;gap:9px;margin-right:auto}
.chip{background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.15);border-radius:8px;padding:4px 11px;text-align:center}
.chip b{display:block;font-size:.92rem;color:var(--teal2)}
.chip small{font-size:.57rem;color:rgba(255,255,255,.5);letter-spacing:.4px}
.cs{background:var(--w);border-bottom:2px solid var(--g1);overflow-x:auto;scrollbar-width:none}
.cs::-webkit-scrollbar{display:none}
.ci{max-width:1400px;margin:auto;padding:7px 18px;display:flex;gap:5px;white-space:nowrap}
.cb{padding:5px 11px;border-radius:30px;border:1.5px solid var(--g2);background:transparent;color:var(--g6);font-size:.74rem;font-weight:600;cursor:pointer;white-space:nowrap;font-family:inherit}
.cb.active{background:var(--navy);border-color:var(--navy);color:#fff}
main{max-width:1400px;margin:auto;padding:20px 18px}
.ph{display:flex;align-items:baseline;justify-content:space-between;flex-wrap:wrap;gap:6px;margin-bottom:14px}
.pt{font-size:1.15rem;font-weight:800;color:var(--navy)}
.pc{font-size:.76rem;color:var(--g4)}
.pc b{color:var(--teal)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(290px,1fr));gap:13px}
.card{background:var(--w);border-radius:13px;border:1.5px solid var(--g1);overflow:hidden;cursor:pointer;transition:transform .18s,box-shadow .18s}
.card:hover{transform:translateY(-2px);box-shadow:0 6px 24px rgba(11,36,68,.1)}
.ct{height:4px}.cb2{padding:14px 16px}
.ch{display:flex;align-items:flex-start;gap:10px;margin-bottom:10px}
.ci2{width:38px;height:38px;border-radius:9px;display:flex;align-items:center;justify-content:center;font-size:1.15rem;flex-shrink:0}
.ctt{font-size:.9rem;font-weight:700;color:var(--navy);line-height:1.3}
.ctag{display:inline-block;margin-top:3px;font-size:.6rem;font-weight:700;letter-spacing:.3px;text-transform:uppercase;padding:2px 6px;border-radius:20px}
.csteps{list-style:none;display:flex;flex-direction:column;gap:4px}
.csteps li{display:flex;align-items:flex-start;gap:7px;font-size:.77rem;color:var(--g6);line-height:1.5}
.sn{width:17px;height:17px;border-radius:50%;flex-shrink:0;margin-top:2px;display:flex;align-items:center;justify-content:center;font-size:.55rem;font-weight:800;color:#fff}
.more{font-size:.68rem;font-weight:700;padding-left:24px}
.cf{display:flex;align-items:center;gap:4px;flex-wrap:wrap;margin-top:10px;padding-top:9px;border-top:1px solid var(--g1)}
.tag{font-size:.6rem;font-weight:700;padding:2px 6px;border-radius:20px}
.tb{background:#dbeafe;color:#1e40af}.tr{background:#fee2e2;color:#991b1b}.tg{background:var(--g1);color:var(--g6)}
.ov{position:fixed;inset:0;background:rgba(11,36,68,.72);z-index:500;display:none;align-items:center;justify-content:center;padding:14px}
.ov.open{display:flex}
.mo{background:var(--w);border-radius:16px;width:100%;max-width:660px;max-height:92vh;overflow-y:auto}
.mh{padding:16px 20px 13px;border-bottom:2px solid var(--g1);position:sticky;top:0;background:var(--w);border-radius:16px 16px 0 0;display:flex;align-items:center;gap:11px}
.mic{width:44px;height:44px;border-radius:11px;display:flex;align-items:center;justify-content:center;font-size:1.35rem;flex-shrink:0}
.mt{font-size:1.05rem;font-weight:800;color:var(--navy)}
.mcat{font-size:.65rem;font-weight:700;margin-top:2px}
.mcl{margin-right:auto;width:28px;height:28px;border-radius:7px;border:1.5px solid var(--g2);background:transparent;cursor:pointer;font-size:.85rem;color:var(--g4);display:flex;align-items:center;justify-content:center;flex-shrink:0;font-family:inherit}
.mb{padding:16px 20px}.ms{margin-bottom:16px}
.mst{font-size:.61rem;font-weight:800;letter-spacing:1.5px;text-transform:uppercase;color:var(--g4);margin-bottom:8px;display:flex;align-items:center;gap:6px}
.mst::after{content:"";flex:1;height:1px;background:var(--g1)}
.ib{border-radius:8px;padding:9px 11px;font-size:.81rem;line-height:1.6;display:flex;align-items:flex-start;gap:7px;margin-bottom:6px}
.ibi{background:#eff6ff;border:1.5px solid #bfdbfe;color:#1e40af}
.ibw{background:#fffbeb;border:1.5px solid #fde68a;color:#78350f}
.ibs{background:#f0fdf4;border:1.5px solid #bbf7d0;color:#14532d}
.eg{display:flex;flex-wrap:wrap;gap:5px}
.ec{background:var(--g1);border-radius:6px;padding:3px 8px;font-size:.73rem;color:var(--g6)}
.sol{list-style:none;display:flex;flex-direction:column;gap:7px}
.sol li{display:flex;align-items:flex-start;gap:9px;font-size:.82rem;color:var(--g6);line-height:1.6}
.sc{width:22px;height:22px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:.6rem;font-weight:800;color:#fff;flex-shrink:0;margin-top:2px}
.rb{background:var(--off);border-radius:8px;padding:11px 13px}
.ri{font-size:.72rem;color:var(--g6);line-height:1.65;padding-left:13px;position:relative;margin-bottom:3px}
.ri::before{content:"\u2022";position:absolute;left:2px;color:var(--teal)}
.nr{grid-column:1/-1;text-align:center;padding:50px 20px;color:var(--g4)}
@media(max-width:600px){.hi{padding:10px 13px;gap:9px}.bn{font-size:1.05rem}.hm{display:none}main{padding:11px 13px}.grid{grid-template-columns:1fr}.mh,.mb{padding:13px}}
</style>
</head>
<body>
<header>
  <div class="hi">
    <div class="logo">N&#961;</div>
    <div><div class="bn">NursePro</div><div class="bs">Evidence-Based Nursing Procedures</div></div>
    <div class="sb"><span class="si">&#128269;</span><input type="text" id="S" placeholder="Search..." autocomplete="off"/></div>
    <div class="hm"><div class="chip"><b id="tP">0</b><small>PROCEDURES</small></div><div class="chip"><b id="tC">0</b><small>CATEGORIES</small></div></div>
  </div>
</header>
<div class="cs"><div class="ci" id="CB"></div></div>
<main>
  <div class="ph"><div class="pt" id="PT">All Procedures</div><div class="pc" id="PC"></div></div>
  <div class="grid" id="G"></div>
</main>
<div class="ov" id="OV">
  <div class="mo">
    <div class="mh"><div class="mic" id="MI"></div><div><div class="mt" id="MT"></div><div class="mcat" id="MC"></div></div><button class="mcl" id="CL">&#10005;</button></div>
    <div class="mb" id="MB"></div>
  </div>
</div>
<script>
var D={"CATS":[{"id":"iv","label":"IV Therapy","icon":"💉","color":"#2563eb","bg":"#eff6ff"},{"id":"airway","label":"Airway Management","icon":"🫁","color":"#7c3aed","bg":"#f5f3ff"},{"id":"wound","label":"Wound & Skin Care","icon":"🩹","color":"#d97706","bg":"#fffbeb"},{"id":"cath","label":"Catheters & Drainage","icon":"🔵","color":"#0891b2","bg":"#ecfeff"},{"id":"vitals","label":"Vital Signs & Monitoring","icon":"📊","color":"#16a34a","bg":"#f0fdf4"},{"id":"meds","label":"Medication Administration","icon":"💊","color":"#db2777","bg":"#fdf2f8"},{"id":"feed","label":"Nutrition & Enteral Tubes","icon":"🧃","color":"#ea580c","bg":"#fff7ed"},{"id":"blood","label":"Blood & Transfusion","icon":"🩸","color":"#dc2626","bg":"#fff1f2"},{"id":"central","label":"Central Lines & Vascular","icon":"🔗","color":"#374151","bg":"#f9fafb"},{"id":"ostomy","label":"Ostomy & Surgical Drains","icon":"🟡","color":"#ca8a04","bg":"#fefce8"},{"id":"cardiac","label":"Cardiac & Resuscitation","icon":"❤️","color":"#e11d48","bg":"#fff1f2"},{"id":"neuro","label":"Neurological & Positioning","icon":"🧠","color":"#6d28d9","bg":"#f5f3ff"},{"id":"hygiene","label":"Infection Control & Hygiene","icon":"🛡️","color":"#0284c7","bg":"#f0f9ff"}],"PROCS":[{"id":1,"cat":"iv","icon":"💉","title":"Peripheral IV Cannula Insertion","summary":"Inserting a short peripheral IV catheter with sterile technique for fluid, medication, or blood product delivery.","equipment":["IV catheter (18–22G adult; 22–24G pediatric/elderly)","Tourniquet","2% CHG/70% alcohol prep swab or 70% isopropyl alcohol","Transparent sterile dressing (e.g., Tegaderm)","Pre-filled NS flush syringe 3–5 mL","Non-sterile gloves","Catheter stabilization device or tape","Sharps container"],"steps":["Perform hand hygiene (WHO 5 Moments). Apply non-sterile gloves.","Identify patient with TWO identifiers (full name + date of birth or MRN). Scan BCMA if available.","Select vein: forearm preferred; dorsal hand as alternative; antecubital last resort (limits mobility).","Apply tourniquet 10–15 cm proximal to insertion site. Palpate for a soft, bouncy, straight vein.","Scrub site with CHG-alcohol or 70% isopropyl in a circular outward motion for ≥30 s. Allow to fully dry (≥30 s, do NOT fan dry).","Stabilize vein with non-dominant hand. Insert catheter bevel-up at 15–30°.","Advance until blood flashback visible in the chamber; lower angle; advance catheter fully off stylet.","Release tourniquet. Apply digital pressure proximal to catheter tip. Retract stylet into safety mechanism.","Connect needleless extension. Flush with 3–5 mL NS using push-pause (turbulent) technique. Confirm no resistance or swelling.","Apply transparent sterile dressing. Label: date, time, catheter gauge, nurse initials.","Document site, gauge, number of attempts, flushing, and patient tolerance."],"warnings":["Inspect site every 4–8 h using the Visual Infusion Phlebitis (VIP) score; score ≥2 requires catheter removal.","Change peripheral IV site every 72–96 hours or sooner if phlebitis or infiltration signs appear (INS 2021).","Do NOT place catheter in arm with AV fistula, post-mastectomy lymphedema, active DVT, or ongoing IV infusion on same side."],"notes":["Gauge selection: 18G for blood products; 20G for most adult patients; 22G for elderly or pediatric patients.","Preferred sites: cephalic/basilic forearm veins (stable, low complication rate); dorsal hand as alternative.","Difficult venous access: warm pack 5 min before insertion; low tourniquet pressure; bedside ultrasound guidance."],"refs":["Infusion Nurses Society (INS). Infusion Therapy Standards of Practice (2021). J Infus Nurs. 44(1S):S1–S224.","Lippincott Nursing Procedures, 9th Ed (2022). Wolters Kluwer. pp 435–444.","Perry AG, Potter PA, Ostendorf WR. Clinical Nursing Skills & Techniques, 10th Ed (2022). Elsevier."]},{"id":2,"cat":"iv","icon":"🧴","title":"IV Fluid Administration — Primary Infusion","summary":"Setting up and regulating prescribed IV fluid infusion via gravity or infusion pump.","equipment":["Prescribed IV bag (verify: type, volume, additives, expiry)","Primary IV administration set (gravity or pump-compatible)","IV pole or infusion pump","Alcohol swabs","Time-strip label and pen"],"steps":["Verify 5 Rights: Right Patient, Fluid/Drug, Dose/Volume, Route, Time.","Inspect IV bag: clarity, absence of particulate matter, intact seal, correct expiry date.","Close roller clamp. Remove port cover aseptically; insert IV spike fully.","Hang bag on IV pole. Squeeze drip chamber 2–3 times to fill it halfway.","Open clamp; prime tubing completely, purging ALL air bubbles. Re-close clamp.","Scrub IV hub ≥15 s with alcohol; allow to dry. Connect primed tubing to patient's patent IV site.","Gravity rate calculation: drops/min = (Volume mL × Drop Factor) ÷ Time in minutes.","Infusion pump: enter volume (mL), rate (mL/h), and VTBI; confirm settings; second-nurse double-check for high-risk fluids.","Label tubing with start date and time. Monitor site and patient response every 1–2 hours.","Change IV tubing every 96 hours (standard set); every 24 hours for blood, lipid-containing, or propofol solutions."],"warnings":["Never co-infuse incompatible solutions through the same lumen without NS flushing between them.","Fluid overload signs: bibasilar crackles, JVD, new S3 gallop, dyspnea, pitting edema — reduce rate and notify physician immediately.","D5W is hypo-osmolar — do NOT use as resuscitation fluid; contraindicated with elevated intracranial pressure (ICP)."],"notes":["NS (0.9% NaCl): isotonic; volume replacement; compatible with most IV medications.","Lactated Ringer's (LR): closest to plasma composition; preferred for large-volume perioperative resuscitation.","D5W: maintenance fluid and medication diluent; NOT for resuscitation.","Flush IV site with 3 mL NS before and after each infusion session (INS 2021 standard)."],"refs":["INS Infusion Therapy Standards of Practice (2021). J Infus Nurs. 44(1S).","Lippincott Nursing Procedures, 9th Ed (2022). pp 447–455.","Lynn P. Taylor's Clinical Nursing Skills, 5th Ed (2019). Wolters Kluwer."]},{"id":3,"cat":"iv","icon":"⚗️","title":"IV Piggyback (IVPB) Medication Administration","summary":"Administering a secondary IV medication bag via Y-site connection through an existing primary infusion line.","equipment":["Secondary medication bag (pharmacy-prepared)","Short secondary IV tubing set","Primary IV infusion in progress","Alcohol swab","Medication and patient label"],"steps":["Perform 5-Rights check. Verify drug-fluid and drug-drug compatibility using current pharmacy reference.","Spike and prime secondary tubing. Hang secondary bag HIGHER than primary bag.","Scrub the upper Y-port of primary tubing for ≥15 s with 70% alcohol; allow to dry ≥15 s.","Connect secondary tubing to Y-port. Clamp primary line below Y-site if back-check valve absent.","Set pump rate and VTBI for the secondary infusion.","After secondary infusion completes: disconnect secondary tubing; restore primary line rate.","Document drug, dose, rate, volume, time administered, and patient response in the MAR."],"warnings":["Ceftriaxone + IV calcium is CONTRAINDICATED in neonates (fatal precipitation reported).","Vancomycin: minimum infusion time 60 minutes per 1 g to prevent Red Man Syndrome (histamine-mediated flushing/hypotension).","Never add medications to a hanging IV bag — risk of concentration error, precipitation, and drug degradation."],"notes":["Secondary bag hangs higher than primary to deliver by gravity pressure differential.","Flush with NS after IVPB completion to clear residual drug from tubing dead space.","Standard IVPB concentrations are pre-mixed by pharmacy in unit-dose or batch-dose systems — verify label carefully."],"refs":["Lippincott Nursing Procedures, 9th Ed (2022). Wolters Kluwer.","ASHP Parenteral Admixture Technical Assistance Bulletin (2023). ashp.org.","INS Standards of Practice — Section 22 (2021). J Infus Nurs."]},{"id":4,"cat":"iv","icon":"🔬","title":"IV Push (Bolus) Medication Administration","summary":"Injecting a medication directly into an IV line over a prescribed safe time interval.","equipment":["Labeled prepared medication syringe","Two NS flush syringes (3–5 mL each)","70% alcohol swab","Non-sterile gloves"],"steps":["Verify 7 Rights. Look up safe IV push rate in a current drug reference before proceeding.","Confirm IV patency: flush with NS; observe for swelling, pain, or resistance.","Scrub needleless connector hub ≥15 s with 70% alcohol; allow to dry ≥15 s (friction + drying time kills organisms).","Pre-flush: inject NS to confirm access patency.","Connect medication syringe; inject at prescribed rate (examples: furosemide ≤4 mg/min; metoprolol 5 mg over 5 min; morphine 2–4 mg/min; adenosine rapid push).","Post-flush: inject NS volume equal to tubing dead space (3–5 mL) to clear residual drug.","Monitor patient continuously during and ≥5–15 min after administration for adverse reactions.","Document: drug, dose, route, rate, time given, and patient response in the MAR immediately."],"warnings":["IV potassium UNDILUTED is FATAL — concentrated potassium must always be diluted and administered slowly via infusion pump.","HIGH-ALERT drugs (insulin, heparin, opioids, concentrated electrolytes, neuromuscular blockers) require independent double-check by a second licensed nurse.","Adenosine must be given as a RAPID push into the largest accessible vein closest to central circulation — half-life is only 10 seconds."],"notes":["ISMP 2024 High-Alert Medication list: print and post at all medication preparation stations.","Pre- and post-flushing confirms patency and prevents drug incompatibility reactions at Y-sites.","Some agents require cardiac monitoring during IV push — always verify current clinical guidelines for the specific drug."],"refs":["ISMP High-Alert Medications List (2024). ismp.org.","Lippincott Nursing Procedures, 9th Ed (2022).","Institute for Healthcare Improvement (IHI) IV Medication Safety Guidelines (2023). ihi.org."]},{"id":5,"cat":"airway","icon":"🫁","title":"Oropharyngeal Suctioning (Yankauer)","summary":"Clearing oropharyngeal secretions to maintain airway patency in patients unable to clear their own secretions.","equipment":["Yankauer suction catheter","Wall suction or portable suction unit","Non-sterile gloves","Face shield and goggles","Sterile water for catheter rinsing"],"steps":["Apply gloves and face shield/goggles. Explain procedure to conscious patient.","Position in semi-Fowler's (30–45°) or lateral if unable to protect own airway.","Set suction pressure: 80–120 mmHg adults; 60–100 mmHg children; 40–60 mmHg infants.","Connect Yankauer to suction tubing; test suction before inserting into patient.","Open patient's mouth; insert Yankauer catheter along the side toward the pharynx — do NOT apply suction during insertion.","Apply suction on withdrawal with gentle rotating motion. Limit each suction pass to ≤15 seconds.","Rinse catheter with sterile water between passes.","Allow ≥30 s recovery between passes. Supplement O₂ if SpO₂ drops below 94%.","Auscultate breath sounds post-suction. Document secretion amount, color, and consistency."],"warnings":["Each suction pass must not exceed 15 seconds — prolonged suctioning causes hypoxia and vagal-mediated bradycardia.","Stimulating the posterior pharynx may trigger vomiting — position patient laterally if aspiration risk is high.","Yankauer is ORAL/PHARYNGEAL use only — do NOT advance into the trachea; use a dedicated tracheal suction catheter for that."],"notes":["Suction only when clinically indicated (visible/audible secretions, SpO₂ decline, respiratory distress).","For oral surgery or facial trauma patients: use extremely gentle technique to avoid injuring repair sites.","Yankauer catheters are single-patient-use; change if visibly soiled or if catheter integrity is compromised."],"refs":["Lippincott Nursing Procedures, 9th Ed (2022). pp 712–716.","Perry AG et al. Clinical Nursing Skills & Techniques, 10th Ed (2022). Elsevier.","AACN Practice Alert: Oral Care in the ICU (2017). Crit Care Nurse. 37(3)."]},{"id":6,"cat":"airway","icon":"🌬️","title":"Endotracheal (Tracheal) Suctioning — Open & Closed Circuit","summary":"Removing secretions from the ETT or tracheostomy tube to maintain airway patency in mechanically ventilated patients.","equipment":["Sterile suction catheter (Fr size = ETT internal diameter mm × 2 ÷ 3) OR closed in-line suction system","Sterile gloves (open system)","Manual resuscitation bag (BVM) with O₂ source","SpO₂ monitor"],"steps":["Pre-oxygenate: increase FiO₂ to 100% for 30–60 s before suctioning.","Open system: establish sterile field; apply sterile glove on dominant hand.","Insert catheter gently into ETT WITHOUT applying suction until resistance is felt; withdraw 1 cm.","Apply suction while withdrawing catheter in a continuous rotating motion. Duration: ≤10–15 s per pass.","Reconnect to ventilator or O₂ source immediately. Allow ≥20–30 s recovery between passes.","Limit to ≤3 suction passes per suctioning episode.","Reassess: bilateral breath sounds, SpO₂, ventilator peak pressures, and patient comfort.","Return FiO₂ to pre-suction setting. Document secretion characteristics and patient response."],"warnings":["Closed-circuit (in-line) suction systems preferred: maintain PEEP, reduce aerosolization, lower VAP risk (AACN 2017).","Routine NS instillation into ETT before suctioning is NOT recommended — increases VAP risk and induces acute desaturation.","STOP immediately if: SpO₂ <90%, HR deviates >20 bpm from baseline, or significant arrhythmia develops."],"notes":["Suction only when clinically indicated — not on a fixed schedule (AACN 2017 evidence-based recommendation).","Closed suction catheter systems: change per manufacturer or hospital policy, typically every 24 hours.","ETT cuff pressure must be maintained at 20–30 cmH₂O — check with aneroid cuff manometer every 8–12 hours."],"refs":["AACN Practice Alert: Endotracheal Suctioning (2010, updated 2017). Am J Crit Care.","Lippincott Nursing Procedures, 9th Ed (2022). Wolters Kluwer.","Sole ML et al. (2017). Endotracheal Suctioning Practices. J Perianesth Nurs."]},{"id":7,"cat":"airway","icon":"😮‍💨","title":"Oxygen Therapy — Nasal Cannula & Face Masks","summary":"Delivering supplemental oxygen at prescribed concentrations using the appropriate delivery device.","equipment":["Nasal cannula OR face mask (simple/partial rebreather/non-rebreather/Venturi mask)","Humidification bottle with sterile water (for flows >4 L/min)","Oxygen flowmeter","Oxygen wall source or cylinder","Pulse oximeter"],"steps":["Verify physician order: device type, flow rate (L/min) or target FiO₂, and target SpO₂ range.","Connect flowmeter to oxygen source. Fill humidification bottle to fill line.","Set prescribed flow rate before applying device to patient.","Nasal cannula: curve prongs downward into nares; route tubing over ears; adjust slider under chin.","Face mask: place over nose and mouth; mold nose clip; set flow rate before placing mask on patient.","Assess SpO₂ and clinical response within 5–10 minutes of starting therapy.","Reassess position, fit, and skin integrity under device every 2–4 hours.","Document: device used, flow rate, SpO₂ before and after, and patient tolerance."],"warnings":["COPD patients: target SpO₂ 88–92% — high FiO₂ can suppress hypoxic ventilatory drive and cause hypercapnia (BTS 2017).","Non-rebreather mask: reservoir bag MUST remain inflated during inhalation — if bag collapses, increase flow rate immediately.","Oxygen enriches atmosphere and significantly increases fire and explosion risk near ignition sources."],"notes":["Nasal cannula: delivers ~24–44% FiO₂ at 1–6 L/min.","Simple face mask: ~35–55% FiO₂ at 5–10 L/min.","Non-rebreather mask: ~60–90% FiO₂ at 10–15 L/min.","Venturi mask: precise, titrated FiO₂ (24–60%) via color-coded adapters — preferred device for COPD patients requiring controlled O₂."],"refs":["O'Driscoll BR et al. (2017). BTS Guideline for Oxygen Use in Adults in Healthcare and Emergency Settings. Thorax. 72(S1):ii1–ii90.","Lippincott Nursing Procedures, 9th Ed (2022). pp 577–582.","WHO (2016). Oxygen Therapy for Children. WHO Press, Geneva."]},{"id":8,"cat":"airway","icon":"🔧","title":"Tracheostomy Care & Tube Management","summary":"Maintaining tracheostomy tube patency, stoma integrity, safe inner cannula management, and emergency readiness.","equipment":["Tracheostomy care kit (sterile basin, pipe cleaners, sterile gauze)","Normal saline 0.9%","Hydrogen peroxide 3% (for reusable inner cannula cleaning only)","New trach holder/ties","Suction equipment","Sterile gloves","Emergency: replacement trach (same size + one size smaller), obturator, 10 mL syringe, BVM"],"steps":["Suction trach secretions BEFORE starting care to reduce risk during tube manipulation.","Two-nurse technique is required for tie/holder changes — one stabilizes tube while other changes ties.","Open sterile supplies; pour NS ± 50:50 H₂O₂/NS into basins.","Don sterile gloves. Remove disposable inner cannula and discard; OR remove reusable inner cannula for cleaning.","Clean reusable inner cannula with pipe cleaners in H₂O₂ solution; rinse thoroughly with NS; inspect for cracks.","Reinsert inner cannula; lock securely into place (audible or tactile click confirmation).","Clean stoma and outer flange: NS-moistened gauze in circular motion from stoma outward.","Apply fresh sterile split-gauze dressing under the trach flange.","Change ties: second nurse holds tube; first removes old ties ONLY AFTER new ties are secured; allow one finger-width space under ties.","Document stoma appearance, secretion character and amount, cuff pressure (20–30 cmH₂O), and patient tolerance."],"warnings":["Bedside emergency equipment MUST be present AT ALL TIMES: replacement trach (same + one smaller size), obturator, 10 mL syringe, BVM, suction.","Accidental decannulation: maintain airway manually (apply O₂ over stoma), call for help IMMEDIATELY, do NOT leave patient.","Do NOT apply H₂O₂ to healing granulation tissue — use NS only; H₂O₂ delays wound healing and may irritate tissue."],"notes":["Perform trach care every 8 hours and PRN (soiled or wet dressing).","Cuff pressure 20–30 cmH₂O — pressure above 30 cmH₂O causes tracheal mucosal ischemia and tracheomalacia over time.","Humidification is MANDATORY for trach patients — the artificial airway bypasses the nose/pharynx which normally warms and humidifies air."],"refs":["AARC Clinical Practice Guideline: Care of the Adult Patient with a Tracheostomy (2020). Respir Care.","Lippincott Nursing Procedures, 9th Ed (2022). pp 758–765.","Morris LL et al. (2013). Tracheostomy Care and Complications in the ICU. J Perianesth Nurs."]},{"id":9,"cat":"airway","icon":"🫀","title":"Bag-Valve-Mask (BVM) Manual Ventilation","summary":"Manually delivering positive-pressure ventilation during respiratory arrest, apnea, or pre-intubation.","equipment":["Appropriately sized BVM device","Oropharyngeal airway (OPA) and/or nasopharyngeal airway (NPA)","O₂ source at ≥15 L/min","Suction ready at bedside","Second rescuer (preferred for two-hand technique)"],"steps":["Confirm unresponsiveness and absent/inadequate breathing. Activate emergency response system.","Position supine. Perform head-tilt chin-lift (jaw-thrust if C-spine injury suspected).","Insert OPA (measure: corner of mouth to earlobe) to keep tongue off posterior pharynx.","Connect BVM to O₂ source at 15 L/min.","One-rescuer C-E grip: index finger and thumb form \"C\" over mask; remaining fingers form \"E\" under mandible; maintain neck extension.","Two-rescuer technique (preferred): first rescuer holds mask with both thumbs on top and fingers under jaw; second rescuer squeezes bag.","Deliver each breath over 1 second — deliver only until visible chest rise (~500–600 mL tidal volume).","Rate: 10–12 breaths/min for adults in respiratory arrest; 20/min for infants; during CPR with advanced airway: 1 breath every 6 seconds asynchronously."],"warnings":["Excessive tidal volume or rate causes gastric insufflation → vomiting → aspiration pneumonia.","Over-ventilation during CPR impairs venous return and reduces coronary perfusion pressure (AHA 2020).","Cricoid pressure (Sellick maneuver) is NOT routinely recommended per 2020 AHA Guidelines — may worsen ventilation."],"notes":["Visible chest rise = adequate tidal volume (~6–8 mL/kg ideal body weight).","No chest rise: reposition airway, check mask seal, consider foreign body obstruction.","Two-rescuer ventilation provides better mask seal and greater tidal volume delivery — always use when staff available."],"refs":["American Heart Association BLS Guidelines (2020). Circulation. 142(16 Suppl 2).","Panchal AR et al. (2020). Part 3: Adult BLS. Circulation. 142:S366–S468.","Lippincott Nursing Procedures, 9th Ed (2022)."]},{"id":10,"cat":"airway","icon":"🌀","title":"Incentive Spirometry & Deep Breathing Exercises","summary":"Preventing postoperative atelectasis and promoting alveolar expansion through guided sustained maximal inspiration.","equipment":["Incentive spirometer (volume-based or flow-based)","Pillow for incision splinting (post-surgical patients)","Documentation chart"],"steps":["Assess: respiratory rate, SpO₂, breath sounds, and patient alertness before starting.","Position patient upright: sitting at edge of bed or high-Fowler's (≥60°) for maximum diaphragmatic excursion.","Demonstrate technique: exhale completely first; form a tight seal around mouthpiece.","Instruct patient to inhale SLOWLY and DEEPLY to raise piston or ball to target marker.","Hold breath at maximum inhalation for 3–5 seconds to allow alveolar recruitment.","Exhale slowly through pursed lips. Rest 30 seconds between repetitions.","Perform 10 repetitions every 1–2 hours while awake.","Post-surgical patients: splint incision with pillow during deep breathing to reduce pain and facilitate full inspiration.","Follow each IS session with an effective cough to mobilize loosened secretions.","Document: volumes achieved per session and patient compliance."],"warnings":["IS is ineffective in sedated, confused, or uncooperative patients — defer until patient can follow instructions.","Rapid or excessive breaths cause hyperventilation and dizziness — slow down and rest between repetitions.","IS alone does not adequately replace early ambulation post-surgery — ambulation is the highest-priority intervention."],"notes":["Normal adult baseline IS volume: ~2,500–3,000 mL; post-surgical goal: 70–80% of pre-operative baseline.","Volume-based spirometers (e.g., Coach 2) provide objective measurement; flow-based (ball type) are simpler.","AARC 2011 guideline: IS has greatest benefit when part of a multi-component respiratory care program including ambulation and positioning."],"refs":["AARC Clinical Practice Guideline: Incentive Spirometry (2011). Respir Care. 56(10):1600–1604.","Freitas ER et al. (2012). IS vs. Deep Breathing Exercises Post-Surgery. Cochrane Database Syst Rev.","Lippincott Nursing Procedures, 9th Ed (2022). pp 398–403."]},{"id":11,"cat":"wound","icon":"🩹","title":"Wound Dressing Change — Dry & Moist Dressings","summary":"Cleaning a wound and applying the appropriate dressing using aseptic non-touch technique (ANTT) to promote healing and prevent infection.","equipment":["Non-sterile gloves (removal) + sterile gloves (application)","Sterile gauze pads","Normal saline for irrigation (30 mL syringe + 19G angiocath)","Appropriate dressing per wound type (gauze, foam, hydrocolloid, alginate, etc.)","Medical-grade adhesive tape","Clean waste bag"],"steps":["Hand hygiene. Gather supplies. Explain procedure; position patient for optimal access.","Apply non-sterile gloves. Remove old dressing by peeling toward wound center. Observe exudate: amount, color, odor, consistency.","Discard soiled dressing. Remove non-sterile gloves. Perform hand hygiene.","Open sterile supplies using ANTT (aseptic non-touch technique). Pour NS into sterile basin.","Apply sterile gloves.","Assess wound using TIME framework: Tissue type (necrotic/granulating/epithelializing), Infection/Inflammation, Moisture balance, Edge advancement.","Irrigate contaminated wounds with NS via 30 mL syringe + 19G angiocath at 8–15 psi (optimal cleansing pressure).","Pat wound bed dry with sterile gauze.","Select and apply appropriate dressing; secure with tape. Label with date, time, and nurse initials.","Document wound assessment: dimensions (L × W × D), tissue type %, exudate amount/quality, periwound skin status, and dressing applied."],"warnings":["Wound infection signs: erythema >2 cm from edge, increased warmth, purulent exudate, fever, malodor, or wound breakdown — notify provider promptly.","Always clean from wound center outward — cleaning from dirty to clean area contaminates the wound.","Dressing change frequency is determined by exudate level and dressing type — not a fixed daily schedule."],"notes":["Moist wound healing is the evidence-based standard; \"wet-to-dry\" dressings for debridement are an OUTDATED practice (WOCN 2016).","Wound measurement at each dressing change: compare to previous to assess progression or deterioration.","Wound photography with ruler provides objective documentation — requires patient consent at most institutions."],"refs":["WOCN Clinical Practice Guideline: Wound Management (2016). J Wound Ostomy Continence Nurs.","Lippincott Nursing Procedures, 9th Ed (2022). Wolters Kluwer.","Sibbald RG et al. (2021). Best Practice Recommendations for Prevention and Management of Wounds. Wound Care Canada."]},{"id":12,"cat":"wound","icon":"🔴","title":"Pressure Injury — Assessment, Staging & Prevention","summary":"Systematically identifying, staging, measuring, and preventing pressure injuries using NPIAP classification and validated risk tools.","equipment":["Braden Scale assessment tool","Sterile flexible measuring ruler","Wound documentation form and camera","Repositioning wedges and foam positioners","Pressure-redistributing mattress or overlay","Skin barrier protectant"],"steps":["Complete Braden Scale on admission and every 24–48 h (or per policy): score ≤18 = at risk; ≤12 = high risk.","Full head-to-toe skin assessment on admission and every 8–12 hours thereafter.","Stage using NPIAP 2019 Classification: Stage 1 (non-blanchable erythema, intact skin); Stage 2 (partial thickness skin loss/blister); Stage 3 (full thickness skin loss, adipose tissue visible); Stage 4 (exposed bone, tendon, or muscle); Unstageable (wound base obscured); Deep Tissue Injury (DTI); Mucosal Membrane PI.","Measure: Length (head-to-toe axis) × Width (perpendicular) × Depth (gently probe with sterile swab). Document undermining and tunneling using clock-face positions.","Implement repositioning schedule: every 2 hours in bed; every 1 hour in chair; use 30° lateral tilt wedge (preferred over 90° side-lying).","Protect heels: elevate off mattress using pillow placed under calves — never use donut-shaped devices.","Apply skin barrier product (zinc oxide, dimethicone, or liquid acrylate polymer) to intact at-risk periwound skin.","Nutritional support: consult dietitian; protein goal 1.2–1.5 g/kg/day; micronutrient supplementation as indicated."],"warnings":["Stage 3, 4, Unstageable, or DTI requires immediate provider notification and wound care specialist referral.","Document ALL pre-existing PI at admission — failure to do so implies they are facility-acquired injuries (legal and quality implication).","NEVER massage reddened bony prominences — this increases shear force and worsens ischemic injury to the underlying tissue."],"notes":["Most common PI sites: sacrum > heels > ischial tuberosities > trochanters > lateral malleoli > occipital region.","Stage 1 blanch test: press firm fingertip on erythema for 3 s; blanchable = reactive hyperemia (normal); non-blanchable = Stage 1 PI.","Pressure-redistributing surfaces reduce interface pressure but do NOT eliminate the need for scheduled repositioning."],"refs":["NPIAP (National Pressure Injury Advisory Panel). Prevention and Treatment of Pressure Ulcers/Injuries: Clinical Practice Guideline (2019). npiap.com.","European Pressure Ulcer Advisory Panel (EPUAP) & PPPIA. International Clinical Practice Guideline (2019).","Lippincott Nursing Procedures, 9th Ed (2022). pp 629–636."]},{"id":13,"cat":"wound","icon":"✂️","title":"Suture & Staple Removal","summary":"Removing skin sutures or staples at the appropriate time after confirmed wound healing using aseptic technique.","equipment":["Suture scissors (iris scissors) or staple remover","Sterile forceps/pickups","Alcohol swab","Steri-Strips for additional support if needed","Non-sterile gloves","Gauze"],"steps":["Verify physician order. Assess wound: edges approximated without separation, erythema, dehiscence, or drainage.","Apply non-sterile gloves. Clean wound and surrounding skin with alcohol swab; allow to dry.","Suture removal: grasp the suture knot with forceps; cut suture on ONE side close to the skin entry point.","Pull suture thread through tissue TOWARD the wound — never drag the external (contaminated) portion back through the tissue track.","Staple removal: center staple remover jaws under the staple crown; squeeze handles to evert staple ends; lift away from skin.","Count all sutures/staples removed and confirm it matches total number documented at placement.","Apply Steri-Strip closure strips across the wound line if additional support is needed.","Inspect the final wound closure; document appearance, number removed, and patient tolerance."],"warnings":["Do NOT remove if wound edges are separating, patient is on chronic steroids/immunosuppressants, or infection is suspected — consult provider.","Pulling the contaminated external suture portion backward through tissue introduces surface bacteria into the wound track.","Early removal (before healing time guidelines) increases dehiscence risk; late removal causes epithelial suture tracks and scarring."],"notes":["Removal timing: Face 5–7 days; Scalp 7–10 days; Trunk/abdomen 7–10 days; Extremities 10–14 days; Joints 10–14 days; Foot 14+ days.","Alternate suture removal (every other suture) is appropriate in high-tension areas to reduce dehiscence risk.","Verify suture type before scheduling removal — absorbable sutures (Vicryl, Monocryl) do not require removal."],"refs":["Lippincott Nursing Procedures, 9th Ed (2022). pp 661–665.","Perry AG et al. Clinical Nursing Skills & Techniques, 10th Ed (2022). Elsevier.","Singer AJ & Clark RAF (1999). Cutaneous Wound Healing. N Engl J Med. 341:738–746."]},{"id":14,"cat":"wound","icon":"🌀","title":"Negative Pressure Wound Therapy (NPWT)","summary":"Applying controlled sub-atmospheric pressure to promote granulation, reduce wound edema, and manage exudate in complex wounds.","equipment":["NPWT unit (e.g., KCI V.A.C. Ulta or Smith+Nephew PICO)","Black polyurethane or white polyvinyl alcohol foam filler","Transparent adhesive drape (film)","Connecting tubing and suction disc/pad","Sterile gloves and non-sterile gloves"],"steps":["Obtain physician order: foam type (black = acute wounds; white = fragile/tunneling), pressure setting, and mode (continuous or intermittent).","Assess wound bed, depth, tissue type, and periwound skin condition.","Cut foam to fill wound bed dimensions — no overlap onto healthy periwound skin.","Cover foam and 3–5 cm of periwound skin entirely with transparent adhesive drape; ensure completely airtight seal.","Cut a 2 cm circle through the drape; attach suction disc/pad; connect tubing to NPWT unit.","Set prescribed pressure (typically –125 mmHg continuous for most acute wounds; lower pressures for fragile tissue).","Activate unit: foam should visibly contract within 30–60 seconds confirming adequate seal.","Foam dressing change: every 48–72 hours (or more frequently if highly exudative or infected).","At each change: COUNT all foam pieces removed; inspect wound bed, periwound skin, and document."],"warnings":["NPWT is CONTRAINDICATED in: exposed blood vessels/nerves/anastomoses; malignancy within wound bed; untreated osteomyelitis; non-enteric fistulas; necrotic eschar prior to debridement.","RETAINED FOAM is a serious complication — count all pieces removed; document piece count at every change.","Do NOT apply foam filler directly to exposed organs, bowel, or fragile vascular anastomoses."],"notes":["NPWT mechanisms: mechanical deformation stimulates cell proliferation; fluid removal reduces interstitial edema; increases local blood flow.","Canister: change when full or at 7-day maximum to prevent bacterial overgrowth.","Incisional (closed) NPWT: reduces SSI rate in high-risk post-surgical incisions (obese patients, contaminated wounds, cardiac surgery)."],"refs":["Lippincott Nursing Procedures, 9th Ed (2022). pp 804–811.","Orgill DP et al. (2009). Mechanisms of Action of NPWT. Ann Surg. 250(6):898–904.","WOCN (2017). Guideline for Management of Wounds in Patients with Lower-Extremity Venous Disease."]},{"id":15,"cat":"cath","icon":"🔵","title":"Urinary Catheterization — Indwelling Foley (Male & Female)","summary":"Inserting an indwelling urinary catheter using strict sterile technique for continuous bladder drainage.","equipment":["Foley catheter (14–18 Fr adult; 8–12 Fr pediatric)","Sterile catheterization kit (drapes, basin, forceps, gauze, lubricant, specimen cup)","10 mL syringe pre-filled with sterile water for balloon inflation","Antiseptic solution (betadine or CHG)","Closed urinary drainage bag with anti-reflux valve"],"steps":["Verify physician order. Hand hygiene. Provide privacy; explain the procedure fully.","Female: dorsal recumbent (frog-leg) position with adequate lighting. Male: supine, legs slightly apart.","Open kit using strict sterile technique. Apply sterile drapes. Don sterile gloves.","Pour antiseptic into basin. Coat catheter tip generously with lubricant (5 cm female; 15–20 cm male entire catheter length).","Female cleansing: non-dominant hand separates labia and MAINTAINS POSITION THROUGHOUT. Cleanse urethral meatus with 3 antiseptic swabs: center → right → left (each swab used once only; never revisit).","Male cleansing: retract foreskin (if intact) with non-dominant hand; MAINTAIN THROUGHOUT. Cleanse glans/meatus with expanding circular motion × 3 separate swabs.","Insert catheter 5–7.5 cm (female) or 17–22 cm (male) until urine flows; advance 2–3 cm further before balloon inflation.","Inflate balloon with 10 mL sterile water ONLY AFTER confirming urine return.","Gently withdraw catheter until resistance confirms balloon is seated against bladder neck.","Connect to closed drainage bag. Secure catheter to inner thigh (female) or lower abdomen (male). Bag must be below bladder. Label with insertion date."],"warnings":["NEVER inflate balloon before urine return is confirmed — inflation in the urethra causes urethral rupture and severe pain.","Never force catheter against resistance — obtain urology consultation for suspected obstruction (BPH, urethral stricture).","Maintain closed drainage system at ALL times — system breach is the #1 preventable CAUTI risk (CDC)."],"notes":["CAUTI prevention bundle: aseptic insertion + closed drainage system + perineal hygiene twice daily + drainage bag below bladder + daily necessity review.","Catheter-associated UTI (CAUTI) affects up to 36% of catheterized inpatients — most preventable HAI (CDC data).","Use smallest appropriate catheter gauge; larger catheters increase urethral inflammation and CAUTI risk."],"refs":["SUNA Clinical Practice Guideline: Female and Male Urethral Catheterization (2015). suna.org.","CDC CAUTI Prevention Guidelines (2009, updated 2017). cdc.gov/nhsn.","Lippincott Nursing Procedures, 9th Ed (2022). pp 98–117."]},{"id":16,"cat":"cath","icon":"🔹","title":"Intermittent (Straight) Urinary Catheterization","summary":"Temporary catheter insertion to measure post-void residual, drain the bladder, or obtain a sterile urine specimen.","equipment":["Robinson (straight) catheter (same sizing as Foley)","Sterile gloves + sterile drape","Antiseptic solution","Water-soluble lubricant","Sterile specimen cup if ordered"],"steps":["Verify order and indication: urinary retention, post-void residual measurement, or sterile specimen collection.","Perform hand hygiene. Assemble sterile field.","Cleanse urethral meatus using same antiseptic technique as indwelling catheterization (see Procedure #15).","Insert catheter until urine flows. Collect sterile specimen first if ordered.","Allow complete bladder drainage; gently withdraw catheter once flow ceases.","If PVR >300 mL: consider leaving catheter in place as indwelling; notify provider.","Document: volume drained, urine characteristics (color, clarity, odor), and patient tolerance."],"warnings":["Bladder ultrasound (portable scanner) is the non-invasive preferred method to estimate PVR before deciding on catheterization.","PVR consistently >150–200 mL on 2 separate occasions suggests incomplete emptying — discuss scheduled intermittent catheterization (IC) program with provider.","Repeated catheterizations >4× daily without clear indication increase urethral trauma and UTI risk."],"notes":["PVR normal: <50 mL; borderline: 50–100 mL; clinically significant: >150 mL.","Intermittent catheterization (IC) is the preferred long-term management for neurogenic bladder — significantly lower CAUTI rate than indwelling catheter.","IC schedule for SCI patients: typically every 4–6 hours adjusted to fluid intake and measured residual volumes."],"refs":["SUNA Clinical Practice Guidelines (2015). suna.org.","Lippincott Nursing Procedures, 9th Ed (2022).","Hooton TM et al. (2010). IDSA Guidelines for Diagnosis and Treatment of CAUTI. Clin Infect Dis. 50(5):625–663."]},{"id":17,"cat":"cath","icon":"💧","title":"Continuous Bladder Irrigation (CBI)","summary":"Irrigating the bladder continuously with normal saline to prevent clot retention after urological procedures.","equipment":["3-way Foley catheter (for CBI) or 2-way for manual irrigation","Sterile irrigation solution (0.9% NaCl only)","CBI administration set and IV pole","60 mL syringe (for manual irrigation)","Urometer/measuring container"],"steps":["Verify order: CBI versus intermittent manual irrigation, solution type, and target outflow color.","For CBI: spike irrigation bag with CBI tubing; prime tubing; connect to irrigation port (3rd lumen) of 3-way Foley.","Regulate CBI rate to maintain outflow that is light pink/rose-colored (typical starting rate: 200–300 mL/h adjusted to output color).","For manual irrigation: draw 30–50 mL NS into 60 mL syringe; cleanse catheter irrigation port with alcohol.","Insert syringe; instill NS gently; allow to drain by gravity. If resistance: do NOT force — notify provider.","Measure and document EVERY HOUR: irrigation input and drainage output.","Calculate true urine output: Drainage volume − Irrigation volume instilled = True urinary output."],"warnings":["Absent or reduced drainage with continued irrigation input = possible clot obstruction or bladder perforation — notify urologist immediately.","Dark red/bright blood in drainage not clearing with increased CBI rate — notify urologist; do NOT further increase rate.","Discrepancy between input and output exceeding expected volumes may indicate bladder perforation or catheter displacement."],"notes":["CBI is indicated after: TURP, bladder tumor resection, hemorrhagic cystitis, urethral surgery.","True urine output calculation is ESSENTIAL for accurate fluid balance documentation in post-operative patients.","If CBI is discontinued: monitor for clot retention and urinary retention for 2–4 hours post-discontinuation."],"refs":["Lippincott Nursing Procedures, 9th Ed (2022). pp 122–128.","Perry AG et al. Clinical Nursing Skills & Techniques, 10th Ed (2022). Elsevier."]},{"id":18,"cat":"vitals","icon":"📊","title":"Complete Vital Signs Assessment","summary":"Accurately measuring and interpreting temperature, pulse, respirations, blood pressure, and oxygen saturation.","equipment":["Thermometer (oral/tympanic/temporal artery/rectal/axillary)","Sphygmomanometer with stethoscope OR automated NIBP","Watch with second hand","Pulse oximeter probe","NEWS2 or hospital early warning score form"],"steps":["Ensure patient at rest for ≥5 minutes before blood pressure measurement.","Temperature: select appropriate route. Normal oral: 36.5–37.5°C (97.8–99.5°F); add 0.5°C for axillary readings; rectal is the most accurate core temperature measurement.","Radial Pulse: palpate radial artery with 2–3 fingertips for a full 60 seconds. Assess rate, rhythm (regular/irregular), amplitude, and bilateral equality.","Respirations: observe chest excursions for 60 seconds while appearing to count pulse (do NOT announce to patient — alters rate). Note rate, depth, regularity, and work of breathing.","Blood pressure: apply appropriate cuff size, 2–3 cm above antecubital fossa. Inflate 30 mmHg above disappearance of radial pulse; deflate at 2–3 mmHg/s. Record Korotkoff I (systolic) and V (diastolic) sounds.","SpO₂: apply pulse oximetry probe to index finger; confirm clean, unpolished nail; wait for stable waveform before recording.","Apply early warning score (NEWS2): calculate total; escalate care per institutional protocol if triggered.","Document all values with time, patient position, and clinical context."],"warnings":["Do NOT take BP on arm with IV infusion, PICC line, AV fistula, lymphedema, or post-mastectomy on that side.","Atrial fibrillation produces an irregular radial pulse — count apical pulse with stethoscope for 60 s for accuracy.","SpO₂ unreliable in: nail polish, vasoconstriction, severe anemia, motion artifact, and CO poisoning (falsely normal reading)."],"notes":["Normal adult ranges: HR 60–100 bpm; RR 12–20/min; BP <120/80 mmHg; Temp 36.5–37.5°C; SpO₂ ≥95%.","Orthostatic blood pressure: measure supine → sitting → standing after 1–3 min in each position. Drop ≥20 mmHg systolic = orthostatic hypotension.","COPD target SpO₂: 88–92% per BTS and ATS guidelines — avoid exceeding 92% in stable COPD patients."],"refs":["Whelton PK et al. (2017). 2017 ACC/AHA Hypertension Guidelines. J Am Coll Cardiol. 71(19):e127–e248.","Royal College of Physicians. National Early Warning Score 2 (NEWS2) (2017). rcplondon.ac.uk.","Lippincott Nursing Procedures, 9th Ed (2022)."]},{"id":19,"cat":"vitals","icon":"⚡","title":"12-Lead ECG Acquisition","summary":"Performing a 12-lead ECG with precise electrode placement for accurate cardiac rhythm and ischemia analysis.","equipment":["12-lead ECG machine","10 electrodes (4 limb + 6 precordial)","Pre-gelled disposable electrode patches","Razor (for chest hair if present)","Alcohol wipes for skin preparation"],"steps":["Explain procedure. Position patient supine, warm, and as relaxed as possible.","Expose chest, wrists, and ankles. Shave or clip chest hair over precordial electrode sites if needed.","Clean each electrode application site with alcohol wipe; allow to fully dry (reduces impedance).","Limb electrodes: RA → right wrist or upper arm; LA → left wrist or upper arm; RL → right ankle or leg; LL → left ankle or leg.","Precordial (V lead) placement: V1 → 4th ICS right sternal border; V2 → 4th ICS left sternal border; V3 → midway between V2 and V4; V4 → 5th ICS midclavicular line; V5 → anterior axillary line (same horizontal level as V4); V6 → midaxillary line (same level as V4–V5).","Apply electrode patches firmly with no air gaps. Connect color-coded lead wires.","Instruct: \"Stay still and breathe normally.\" Acquire tracing.","Review all 12 leads for clarity. Repeat acquisition if artifact is present.","Print/transmit; document patient ID, date, time, clinical indication.","Notify provider IMMEDIATELY if STEMI pattern, complete heart block, or malignant arrhythmia identified."],"warnings":["Lead reversal (e.g., RA and LA switched) produces pseudo-infarction patterns and can lead to incorrect diagnosis and treatment.","Shivering and 60-Hz AC interference produce artifact mimicking ventricular arrhythmias — assess patient clinically before initiating any emergency response.","STEMI: door-to-balloon time goal <90 minutes — activate cardiac catheterization lab immediately upon ECG recognition."],"notes":["V lead placement mnemonic: \"Start at the sternum (V1, V2), find the midclavicular (V4), then follow the axillary line (V5, V6).\"","AHA US color coding: White=RA, Black=LA, Green=RL, Red=LL, Brown/Multi=V leads.","QTc >500 ms with QT-prolonging drugs (haloperidol, azithromycin, methadone, fluoroquinolones) requires urgent cardiology input."],"refs":["Surawicz B et al. (2009). AHA/ACCF/HRS Recommendations for the Standardization of ECG Interpretation. J Am Coll Cardiol. 53(11):976–981.","Lippincott Nursing Procedures, 9th Ed (2022).","Thaler MS. The Only EKG Book You'll Ever Need, 9th Ed (2018). Wolters Kluwer."]},{"id":20,"cat":"vitals","icon":"📈","title":"Pain Assessment Using Validated Scales","summary":"Systematically assessing, documenting, and reassessing pain using validated tools to guide individualized analgesia.","equipment":["NRS 0–10 scale (verbal adults)","Wong-Baker FACES scale (children ≥3 years, cognitively impaired)","Critical Care Pain Observation Tool (CPOT) for intubated/non-verbal adults","FLACC scale (infants, non-verbal children <7 years)","Documentation record"],"steps":["Assess pain at: admission, every vital signs cycle, before and after analgesic interventions, and with clinical change.","Use OLDCART: Onset, Location, Duration, Character, Aggravating factors, Relieving factors, Temporal pattern.","NRS: \"On a scale of 0 to 10, where 0 is no pain and 10 is the worst possible pain, what is your pain right now?\"","CPOT (intubated/non-verbal): score 4 domains: Facial Expression (0–2) + Body Movements (0–2) + Ventilator Compliance (0–2) + Muscle Tension (0–2). Total 0–8; score ≥3 = significant pain.","Assess pain at REST and with movement/activity (functional pain is most clinically relevant for recovery).","Reassess: 30–60 min after IV/IM analgesic; 60–90 min after oral/SC analgesic.","Set a patient-specific functional pain goal (e.g., \"pain ≤3 to turn in bed; ≤4 to ambulate\").","Document: scale used, numeric score, location, intervention given, and reassessment score."],"warnings":["Undertreated pain causes physiological stress: tachycardia, hypertension, splinting → atelectasis, PE, impaired wound healing.","Opioid monitoring: use Pasero Opioid-Induced Sedation Scale (POSS) + respiratory rate before each dose; HOLD if RR <10/min or POSS score 3–4.","Never dismiss pain in cognitively impaired, behaviorally stoic, or culturally reserved patients — observe behavioral cues and physiological indicators."],"notes":["Self-report is the gold standard for pain assessment when the patient can communicate.","Multimodal analgesia (NSAIDs + acetaminophen + opioid + adjuvants) reduces opioid consumption by 30–50% (ERAS Society protocols).","Non-pharmacological interventions: repositioning, heat/cold application, distraction, guided imagery, relaxation breathing, music therapy."],"refs":["Pasero C & McCaffery M (2011). Pain Assessment and Pharmacological Management. St. Louis: Elsevier Mosby.","Gelinas C et al. (2006). CPOT: Development and Validation in ICU Patients. Am J Crit Care. 15(4):420–427.","The Joint Commission Pain Management Standards (2018). jointcommission.org."]},{"id":21,"cat":"vitals","icon":"🖥️","title":"Continuous Cardiac Monitoring Setup","summary":"Applying electrodes and configuring a bedside or telemetry cardiac monitor for continuous rhythm surveillance.","equipment":["3-lead or 5-lead electrode set","Pre-gelled disposable adhesive electrodes","Bedside cardiac monitor or telemetry transmitter","Alcohol prep pads","Light skin abrasive pad if needed"],"steps":["Explain continuous monitoring to patient. Provide privacy during electrode application.","Prepare skin: clean with alcohol, allow to dry; abrade lightly if poor signal anticipated.","3-lead placement: RA (white) → right subclavicular area; LA (black) → left subclavicular area; LL (red) → left lower ribs.","5-lead adds: RL (green) → right lower ribs (electrical ground); V (brown) → V1 position (4th ICS, right sternal border).","AHA color code: White=RA; Black=LA; Red=LL; Green=RL; Brown=V.","Power on monitor. Select lead with clearest P wave and QRS (usually Lead II for most patients).","Set individualized alarm limits for HR high and low. Test alarm functionality.","Document baseline rhythm strip in nursing notes. Reapply rhythm strip every 8 hours and with clinical changes.","Respond to EVERY alarm — assess patient before silencing any alarm."],"warnings":["Alarm fatigue is a critical patient safety issue (TJC Sentinel Event Alert, 2013) — alarm silence without patient assessment has caused preventable cardiac arrest deaths.","Change electrodes every 24–48 hours — dried gel reduces adhesion and creates artifact that can mimic life-threatening rhythms.","Paced rhythms may not trigger rate alarms if pacemaker spikes are not detected — verify pacemaker capture separately."],"notes":["Lead II provides best P-wave visibility for rhythm identification; V1 or MCL-1 best for morphology differentiation (SVT vs. VT).","VF on monitor: immediately ASSESS PATIENT before initiating CPR — confirm it is not artifact from patient movement.","AHA 2004 ECG Monitoring Standards remain the reference for lead placement in all monitored settings."],"refs":["Drew BJ et al. (2004). AHA Practice Standards for ECG Monitoring in Hospital Settings. Circulation. 110(17):2721–2746.","AACN Practice Alert: Alarm Management (2013). Crit Care Nurse. 33(5).","Lippincott Nursing Procedures, 9th Ed (2022)."]},{"id":22,"cat":"meds","icon":"💊","title":"The 7 Rights of Medication Administration","summary":"Systematic safety verification framework applied before every medication administration to prevent errors and harm.","equipment":["Medication Administration Record (MAR)","Patient identification wristband","Current drug reference (electronic or print)","BCMA barcode scanner (if available)"],"steps":["① Right PATIENT: verify using TWO identifiers — full name + date of birth, or full name + MRN. Scan barcode if BCMA available. Ask patient to state their name — never prompt with the correct answer.","② Right MEDICATION: read drug label at THREE checkpoints — retrieving from storage, preparing/drawing up, and at the bedside. NEVER administer a medication drawn up by another nurse.","③ Right DOSE: calculate dose independently. For weight-based dosing, verify patient weight in kg. Perform independent double-check for HIGH-ALERT medications.","④ Right ROUTE: confirm route on MAR matches patient's clinical state — can patient swallow? Is IV access patent and appropriate? Is IM site appropriate?","⑤ Right TIME: administer within ±60 minutes of scheduled time (or per policy). Identify time-critical medications: STAT orders, antibiotic first doses, insulin, thrombolytics.","⑥ Right DOCUMENTATION: document in MAR IMMEDIATELY AFTER administration — never document before. Record time, dose, route, and nurse signature.","⑦ Right REASON: know the pharmacological rationale. Question orders inconsistent with clinical presentation — this is a professional and legal safety responsibility.","Always check ALLERGY status before administering any new or unfamiliar medication."],"warnings":["HIGH-ALERT drugs (insulin, heparin, opioids, neuromuscular blockers, concentrated electrolytes, anticoagulants) require independent double-check by a second licensed nurse.","Verbal orders must be written and countersigned by the ordering provider within 24 hours (TJC Medication Management Standard).","NEVER crush enteric-coated (EC), sustained-release (SR/XR/XL/CR/LA/ER), sublingual, or buccal formulations."],"notes":["BCMA (Barcode Medication Administration) systems reduce wrong-patient and wrong-drug errors by ~85% (IHI data).","Medication refused or withheld: document reason in MAR and notify prescriber promptly.","Patient education at each administration: state drug name, purpose, and key adverse effects."],"refs":["The Joint Commission Medication Management Standards (2024). jointcommission.org.","ISMP Principles of Error-Proof Medication Preparation (2023). ismp.org.","Lippincott Nursing Procedures, 9th Ed (2022). pp 504–511."]},{"id":23,"cat":"meds","icon":"💉","title":"Intramuscular (IM) Injection","summary":"Administering medication into deep muscle tissue for predictable systemic absorption using correct site selection and technique.","equipment":["Syringe (1–3 mL) + needle (21–23G, 2.5–3.8 cm / 1–1.5 in for standard adult)","Prescribed medication","Alcohol swab","Dry gauze","Non-sterile gloves","Safety-engineered sharps container"],"steps":["Verify 7 Rights. Hand hygiene. Apply non-sterile gloves.","Select injection site: Ventrogluteal (VG) is the safest preferred site for adults.","VG landmark: place palm on greater trochanter; index finger on ASIS; middle finger extended toward iliac crest — inject into the V-shaped space between the fingers.","Vastus lateralis (alternative for infants, small children, or when VG inaccessible): middle third of the anterior-lateral thigh.","Deltoid (for volumes ≤1–2 mL only): 2–3 finger-widths below acromion process, outer lateral arm.","Cleanse site with alcohol swab; allow to dry fully (≥30 s minimum).","For Z-track technique (irritating medications): retract skin laterally 2.5–3.5 cm; maintain retraction throughout injection; release after needle withdrawal.","Insert needle at 90° with a smooth, swift motion. Current evidence does NOT recommend routine aspiration for standard IM sites (WHO 2015; AHA 2020).","Inject at ~1 mL per 10 seconds. Withdraw needle at same angle. Apply gentle gauze pressure — do NOT rub.","Activate safety mechanism; discard directly into sharps container without recapping. Document site, dose, and time."],"warnings":["AVOID dorsogluteal site — high risk of sciatic nerve injury and superior gluteal artery damage; VG is safer in all adults.","Never inject into areas of inflammation, infection, edema, hematoma, or scar tissue.","Epinephrine for anaphylaxis: anterolateral outer thigh (vastus lateralis) is the preferred injection site — NOT the deltoid."],"notes":["Maximum volumes: deltoid 1–2 mL; vastus lateralis 1–5 mL adult; VG 2–5 mL adult.","Z-track technique reduces medication leakage to superficial tissues and decreases injection site irritation — recommended for iron dextran, certain vaccines.","Vaccines: deltoid preferred for adults ≥19 years; vastus lateralis for infants and toddlers < 3 years."],"refs":["WHO (2015). Best Practices for Injections and Related Procedures Toolkit. WHO Press.","Lippincott Nursing Procedures, 9th Ed (2022). pp 527–537.","CDC (2020). Vaccine Administration: General Best Practice Guidelines. cdc.gov/vaccines."]},{"id":24,"cat":"meds","icon":"🖐️","title":"Subcutaneous (SC/SQ) Injection","summary":"Injecting medication into subcutaneous tissue for slow, consistent systemic absorption (insulin, heparin, LMWH, biologics).","equipment":["25–27G needle, 1–1.5 cm (3/8–5/8 in)","1–3 mL syringe","Prescribed medication","Alcohol swab","Non-sterile gloves"],"steps":["Verify 7 Rights. Apply non-sterile gloves.","Select and rotate injection sites systematically: abdomen (>5 cm from umbilicus preferred for insulin and LMWH); anterior thigh; posterior upper arm; scapular region.","For insulin: use a consistent rotation map within each region to maintain predictable absorption kinetics.","Cleanse with alcohol swab; allow to dry fully (≥30 s).","Gently pinch a 2–5 cm skin fold between thumb and forefinger (non-dominant hand).","Insert needle at 45° for lean patients or short needles; 90° for adequate subcutaneous tissue.","Release skin pinch. Inject at a steady, slow rate.","Withdraw needle. For heparin/LMWH: do NOT massage site (causes bruising and alters absorption).","Activate safety mechanism; discard into sharps container. Document site used, dose, and relevant monitoring values (glucose for insulin)."],"warnings":["Lipohypertrophy: firm nodules from repetitive injection in same spot — do NOT inject into nodular areas; insulin absorption is highly unpredictable in lipohypertrophied tissue.","Enoxaparin (Lovenox) pre-filled syringes: do NOT expel the air bubble — it is intentional to flush residual drug from the needle tip after injection.","NEVER shake insulin vials — denatures protein and decreases potency; gently roll NPH or premixed insulins between palms."],"notes":["SC absorption speed: abdomen (fastest) > arm > thigh > scapular/buttock (slowest) — affects insulin action onset timing.","Glargine, detemir, degludec (long-acting insulins): SC ONLY; NEVER IV; no pronounced peak; once-daily dosing.","Lipohypertrophy affects 20–40% of insulin users — inspect injection sites at every diabetes-related assessment."],"refs":["American Diabetes Association (2023). Standards of Medical Care in Diabetes — Insulin Administration. Diabetes Care. 46(Suppl 1).","Lippincott Nursing Procedures, 9th Ed (2022). pp 521–527.","RNAO (2004). Subcutaneous Administration of Insulin: Evidence-Based Practice Guideline."]},{"id":25,"cat":"meds","icon":"🩺","title":"Insulin Administration & Capillary Blood Glucose Monitoring","summary":"Monitoring blood glucose and safely administering insulin with mandatory independent double-check and systematic site rotation.","equipment":["Glucometer + test strips + lancet device","Blood glucose log or EHR record","Insulin syringe or insulin pen + pen needle","Prescribed insulin (verify TYPE precisely)","Alcohol swab"],"steps":["Hand hygiene. Verify physician order: insulin TYPE (rapid-acting/long-acting), DOSE, and TIMING relative to meals.","Blood glucose check: insert test strip; clean lateral fingertip with alcohol; allow to dry; apply lancet; touch blood drop to test strip edge; record result.","Compare result to sliding scale or basal-bolus order; calculate dose. Verify dose against order before drawing up.","Mandatory independent double-check with second licensed nurse for: insulin >5 units, IV insulin infusions, or variance from standard protocol.","Prepare insulin: gently roll NPH or premixed insulin between palms (do NOT shake); NEVER mix insulin glargine, detemir, or degludec with any other insulin.","Administer SC at appropriate site with documented rotation plan.","Rapid-acting (lispro, aspart, glulisine): administer within 15 minutes of meal commencement — patient MUST have meal ready.","Monitor for hypoglycemia: tremor, diaphoresis, pallor, palpitations, confusion. Check glucose if any symptom appears.","Hypoglycemia (BG <70 mg/dL): Rule of 15 → give 15 g rapid-acting carbohydrate → recheck in 15 min → repeat if still <70.","Document: glucose result, insulin type and dose, injection site, and post-dose response or hypoglycemic event."],"warnings":["NEVER administer insulin without a current blood glucose reading immediately prior — glucose levels can change rapidly.","Insulin pens are SINGLE-PATIENT USE ONLY — sharing a pen between patients transmits bloodborne pathogens (HIV, hepatitis B/C).","LASA insulin error: Novolog (aspart) vs. Novolin (human regular); Humalog (lispro) vs. Humulin — store separately, label clearly, and perform double-check."],"notes":["Open insulin vials: stable at room temperature ≤25°C for 28 days; unopened vials/pens: refrigerate 2–8°C; protect from light and heat.","CGM (continuous glucose monitors) do not replace confirmatory fingerstick for dosing decisions (FDA guidance).","Nocturnal hypoglycemia risk: highest 2–4 hours after evening long-acting insulin injection — educate patients on bedtime snack strategy."],"refs":["American Diabetes Association (2023). Standards of Medical Care in Diabetes. Diabetes Care. 46(Suppl 1).","ISMP (2023). Preventing Insulin Errors. ismp.org.","Lippincott Nursing Procedures, 9th Ed (2022). pp 531–540."]},{"id":26,"cat":"meds","icon":"💊","title":"Oral Medication Administration","summary":"Safely preparing and administering oral solid and liquid medications while preventing aspiration and polypharmacy errors.","equipment":["Medication Administration Record (MAR)","Medication cup and cup for water","≥100 mL water or prescribed vehicle","Pill crusher or tablet splitter (verify appropriateness first)","Oral/enteral syringe for liquids"],"steps":["Hand hygiene. Review MAR and complete 7 Rights at the medication preparation area.","Keep each medication in its original packaging until moment of administration.","Do NOT crush: enteric-coated (EC), sustained-release (SR/XR/XL/CR/LA/ER), sublingual, buccal, effervescent, or chewable formulations.","Identify patient with 2 identifiers at bedside. Scan BCMA barcode if available.","Elevate HOB to ≥30° (optimally 60–90° — seated upright) before administration to minimize aspiration risk.","Offer ≥100–120 mL of water with most oral medications. Explain each drug: name, purpose, and key side effects.","Observe patient swallow all medications; remain at bedside until consumed.","Assess for desired pharmacological effect and adverse reactions at appropriate time intervals.","Document in MAR immediately after administration."],"warnings":["NPO patients: confirm with prescriber which medications are permitted with a minimal sip of water and which must be held.","Grapefruit and grapefruit juice inhibit CYP3A4 — contraindicated with many drugs including simvastatin, cyclosporine, amlodipine, tacrolimus, and sildenafil.","Dysphagia: consult speech therapy for swallowing evaluation and use IDDSI-framework thickened fluids as specified."],"notes":["Time-sensitive oral medications: levothyroxine 30 min before breakfast; bisphosphonates 30 min before first food with full water glass; metformin with meals; PPIs 30 min before first meal.","Pre-administration parameter checks: digoxin → apical HR (hold if <60); warfarin → current INR; ACE inhibitors → creatinine and K⁺.","ISMP Do-Not-Crush list 2023 — print and post at medication preparation stations."],"refs":["ISMP (2023). Do Not Crush Medication List. ismp.org.","Lippincott Nursing Procedures, 9th Ed (2022). pp 512–521.","IHI Medication Reconciliation Best Practices (2023). ihi.org."]},{"id":27,"cat":"feed","icon":"🧃","title":"Nasogastric Tube (NGT) Insertion & Placement Verification","summary":"Inserting a nasogastric tube for enteral feeding, decompression, or medication delivery with mandatory radiographic placement confirmation.","equipment":["NGT (14–18 Fr adult; 8 Fr pediatric)","Water-soluble lubricating gel","pH indicator strips (colorimetric)","60 mL ENFit or catheter-tip syringe","Tape or commercial nasal adhesive device","Cup of water with straw (for swallowing assistance)","Penlight for oral inspection","Suction equipment ready"],"steps":["Assess: nares patency (occlude each nostril separately), swallowing ability, LOC, and gag reflex. Explain procedure.","Position: high-Fowler's (60–90°) if tolerated.","Measure tube length: NOSE → EARLOBE → XIPHOID PROCESS + 10 cm. Mark with tape.","Lubricate first 10 cm of tube with water-soluble gel.","Insert through more patent nostril, directing DOWNWARD and BACKWARD along the nasal floor (NOT upward toward the cribriform plate).","When tube enters posterior pharynx: instruct patient to flex chin to chest and swallow continuously; advance tube with each swallow. Cup of water with straw facilitates swallowing.","Advance tube to marked length. If patient coughs violently, vocalizes, or SpO₂ drops — STOP; withdraw; re-attempt.","MANDATORY CHEST X-RAY before any feeding or medication instillation. Tip must be visible ≥10 cm below the gastroesophageal junction in the stomach.","Secondary pH check: aspirate gastric contents; pH <5.5 supports gastric placement (unreliable in patients on PPIs or H2 blockers).","Secure tube to nose with split-foam tape or commercial nasal fixation device. Record external tube length at nostril. Document X-ray confirmation."],"warnings":["FEEDING INTO A MISPLACED NGT IS A POTENTIALLY FATAL NEVER-EVENT — X-ray confirmation is NON-NEGOTIABLE before any use.","Auscultation (air bubble sound over stomach) has been ABANDONED as a reliable placement confirmation method (NPSA 2011; NHS England 2019; WHO).","pH strips alone are NOT reliable in patients on PPIs, H2 blockers, or in non-fasting states — gastric pH may be >5.5 even with correct placement."],"notes":["Gold standard for NGT placement: chest X-ray showing tip position ≥10 cm below the GEJ, in the gastric body or antrum.","Document: tube external length at naris, X-ray confirmation result, name of clinician who confirmed position, and date/time.","Nasogastric tube change: every 4 weeks (or per manufacturer — some silicone tubes can remain up to 3 months)."],"refs":["National Patient Safety Agency (NPSA) Rapid Response Report (2011). Harm from Flushing of Nasogastric Tubes. PSA002.","NHS England Patient Safety Alert (2019): NGT Initial Placement Checks Resource Set.","Lippincott Nursing Procedures, 9th Ed (2022). pp 553–562."]},{"id":28,"cat":"feed","icon":"🥛","title":"Enteral Tube Feeding Administration","summary":"Safely delivering prescribed enteral nutrition via NGT, NJ tube, PEG, or jejunostomy with aspiration precautions.","equipment":["Prescribed enteral formula (check: type, caloric density, osmolarity, expiry)","Enteral-specific pump + ENFit tubing set","60 mL ENFit syringe","Sterile or filtered water for tube flushes","pH strips for pre-bolus check"],"steps":["Verify tube placement confirmation is documented on chart before starting any feed each shift.","Check gastric residual volume (GRV) before each bolus or every 4–6 h for continuous feeds: aspirate with 60 mL syringe; measure; return aspirate to patient (unless >500 mL or infection suspected).","If GRV >200–250 mL (bolus) or >500 mL (continuous): hold feed for 1 hour; reassess; notify provider if elevated GRV persists.","Elevate HOB to 30–45° BEFORE starting; maintain throughout feeding and for 30–60 minutes post-bolus.","Continuous feeding: prime ENFit pump tubing; set prescribed rate (mL/h) on dedicated enteral pump; change formula and tubing every 24 hours (open system).","Bolus/gravity feeding: warm formula to room temperature; administer over 20–30 minutes via gravity syringe only.","Flush tube: 30 mL water before feed, after feed, and before/after each medication administration.","Medications via tube: crush compatible tablets; administer each drug separately in 15–30 mL water; flush 15 mL between each drug.","Document: formula name, volume given, rate, GRV, flush volumes, tolerance signs (nausea, distension, vomiting, diarrhea)."],"warnings":["Aspiration is the most dangerous complication of enteral feeding — HOB elevation + SpO₂ monitoring are non-negotiable.","ENFit tubing must NEVER connect to IV lines — ENFit ISO 80369-3 connectors are mandatory to prevent fatal enteral-IV misconnections.","Do NOT crush sustained-release, enteric-coated, or sublingual medications for tube administration — consult pharmacist for all tube medication orders."],"notes":["ENFit connectors (ISO 80369-3): internationally mandated standard since 2016 to prevent IV-enteral misconnections.","Diarrhea with enteral feeds: check formula osmolarity, delivery rate, sorbitol content in medications, and rule out C. difficile.","Prokinetics (metoclopramide 10 mg IV/PO q6h) may reduce persistently elevated GRV — physician order required; rule out obstruction first."],"refs":["McClave SA et al. (2016). ASPEN/SCCM Clinical Guidelines for Nutrition Support in the Critically Ill. JPEN. 40(2):159–211.","Lippincott Nursing Procedures, 9th Ed (2022). pp 562–573.","ASPEN Enteral Nutrition Practice Recommendations (2022). Nutr Clin Pract."]},{"id":29,"cat":"feed","icon":"🍵","title":"Gastrostomy (PEG) Tube Care & Feeding","summary":"Maintaining PEG tube integrity, stoma health, and safely administering gastrostomy tube feedings.","equipment":["60 mL ENFit syringe","Sterile or filtered water for flushes","Prescribed enteral formula","Gauze + 0.9% NS for stoma care","Non-sterile gloves"],"steps":["Verify tube position: record external bumper measurement at each assessment shift and compare to insertion baseline.","Assess PEG stoma: erythema, granulation tissue, hypergranulation, leakage around tube, buried bumper signs.","Stoma care: clean daily with NS-moistened gauze in circular motion from tube outward; pat dry; apply split-gauze dressing.","Gently rotate external bumper 360° and push in/pull out slightly to prevent buried bumper formation (per institutional policy).","Check GRV before each bolus or every 4–6 h for continuous feeding.","Elevate HOB 30–45° before and during feeding; maintain 30 min post-bolus.","Flush: 30 mL water before feed, after feed, and before/after each medication.","Medications: verify crushability with pharmacist; administer each drug separately; flush 15 mL between drugs.","Document: external tube measurement, stoma assessment findings, GRV, volume given, and tolerance."],"warnings":["Buried bumper syndrome: inability to rotate the tube, leakage despite intact system, and pain at stoma = endoscopic emergency; do NOT force tube; notify GI immediately.","Accidental PEG removal (>6 weeks post-insertion): immediately insert a 16–18 Fr Foley catheter into the tract to maintain patency; notify GI surgery STAT.","Never administer enteral feeding if tube external length measurement has changed (possible displacement) without re-confirmation."],"notes":["PEG tubes: typically not electively replaced unless malfunction; can remain in place 3–6+ months or longer.","Hypergranulation at stoma: silver nitrate application (physician/provider order) or foam compression dressing.","Button (low-profile) gastrostomy: attach extension set before each feed; remove and cap securely after each use."],"refs":["ASPEN (2022). Enteral Nutrition Clinical Guidelines. Nutr Clin Pract.","Lippincott Nursing Procedures, 9th Ed (2022). pp 573–581.","Blumenstein I et al. (2014). PEG: Aspects of Quality Management. Z Gastroenterol. 52(6):683–705."]},{"id":30,"cat":"blood","icon":"🩸","title":"Blood Transfusion Administration","summary":"Safely administering prescribed blood products with mandatory dual verification and continuous monitoring for transfusion reactions.","equipment":["Prescribed blood product from blood bank","Blood administration set with 170–260 micron filter","0.9% NaCl (ONLY compatible flush for blood products)","18G or larger peripheral IV or appropriate central access","Vital signs equipment","Transfusion reaction documentation form"],"steps":["Verify physician order, patient consent, and blood bank compatibility report.","DUAL BEDSIDE VERIFICATION with a second licensed nurse: patient ID × 2 identifiers; ABO/Rh on product label matches patient wristband; unit/donation number matches transfusion tag; product type; expiry date and time.","Obtain baseline vital signs (T, HR, RR, BP, SpO₂) within 30 minutes before starting transfusion.","Prime blood administration set with 0.9% NaCl. Connect to patient's IV.","Start infusion SLOWLY: 2 mL/min (or approximately 30 mL in first 15 minutes) — remain at bedside continuously for first 15 minutes.","Vital signs at 15 minutes post-start; then per protocol (typically at 1 hour and at completion).","If no adverse reaction: adjust to prescribed rate. pRBCs must be completed within 4 hours of removal from blood bank.","At completion: flush with NS; document start time, end time, total volume infused, and patient response.","Return empty blood product bag (with administration set) to blood bank per institutional policy."],"warnings":["Acute Hemolytic Transfusion Reaction (AHTR): fever, rigors, severe back/flank pain, hypotension, hemoglobinuria — STOP TRANSFUSION IMMEDIATELY; infuse NS; call physician; send blood and urine samples to lab; return product to blood bank.","NEVER add any medication, IV soluti
