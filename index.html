on, or fluid other than 0.9% NaCl to blood product tubing — causes hemolysis and product degradation.","Febrile Non-Hemolytic Reaction (most common): temperature rise >1°C above baseline — STOP transfusion; rule out AHTR before considering antihistamine/antipyretic and resuming."],"notes":["Universal donors: Group O Rh-negative for pRBCs; Group AB Rh-positive for plasma.","Irradiated blood products required for immunocompromised patients to prevent transfusion-associated graft-versus-host disease (TA-GVHD).","Platelet infusion: ≤30 min per unit; FFP over 30–60 min; cryoprecipitate as fast as tolerated."],"refs":["AABB Standards for Blood Banks and Transfusion Services, 32nd Ed (2020). aabb.org.","Lippincott Nursing Procedures, 9th Ed (2022). pp 786–800.","WHO Blood Transfusion Safety Technical Manual, 3rd Ed (2016). WHO Press."]},{"id":31,"cat":"blood","icon":"🧪","title":"Venipuncture & Venous Blood Specimen Collection","summary":"Collecting blood specimens from peripheral veins with correct order of draw for accurate laboratory analysis.","equipment":["Vacutainer holder + 21–22G needle (or syringe + needle for difficult veins)","Appropriate specimen tubes (per lab orders)","Tourniquet","70% isopropyl alcohol swab","Non-sterile gloves","Gauze + adhesive bandage","Pre-labeled specimen tubes","Biohazard transport bag"],"steps":["Review lab orders. Pre-label all tubes: patient name, MRN, date, time, collector initials.","Identify patient with 2 identifiers. Apply tourniquet 5–10 cm proximal to site.","Select vein: antecubital fossa preferred; forearm or dorsal hand as alternatives. Palpate for a straight, bouncy, non-tortuous vein.","Cleanse with 70% alcohol swab using circular outward motion; allow to dry completely (≥30 s).","Insert needle bevel-up at 15–30°. Advance until blood enters the flashback chamber.","Stabilize needle. Insert Vacutainer tubes in correct ORDER OF DRAW (see notes below).","Immediately invert each additive tube 8–10 times gently (do NOT shake).","Release tourniquet BEFORE withdrawing needle. Apply gauze; firm pressure ≥60–120 s (longer for anticoagulated patients).","Activate needle safety mechanism. Discard into sharps container. Apply adhesive bandage.","Transport specimens within recommended time frame (most tests require ≤30–60 min; blood cultures immediately)."],"warnings":["NEVER collect from arm with active IV infusion on the same side — IV fluid dilutes and contaminates specimens.","Hemolysis caused by forceful aspiration, vigorous shaking, or prolonged tourniquet (>1 min) invalidates results — particularly K⁺, LDH, and CK levels.","Incorrect order of draw causes additive cross-contamination between tubes and alters coagulation studies (PT/INR, aPTT)."],"notes":["CLSI GP41 ORDER OF DRAW (2017): 1. Blood culture (yellow/SPS) → 2. Citrate coagulation (light blue) → 3. Serum/SST (gold/tiger) → 4. Lithium heparin (green) → 5. EDTA (lavender/purple) → 6. Fluoride/oxalate (gray).","SST tubes (gold): allow 30 minutes for clot formation before centrifugation.","Blood cultures: clean skin with 2% CHG-alcohol or betadine; obtain 2 sets (aerobic + anaerobic) from 2 separate sites."],"refs":["CLSI GP41-ED7: Collection of Diagnostic Venous Blood Specimens, 7th Ed (2017). clsi.org.","Lippincott Nursing Procedures, 9th Ed (2022). pp 107–115.","AABB Technical Manual, 20th Ed (2020). aabb.org."]},{"id":32,"cat":"blood","icon":"🔴","title":"Arterial Blood Gas (ABG) Sample Collection","summary":"Obtaining an arterial blood specimen from the radial artery for acid-base balance and oxygenation status analysis.","equipment":["Pre-heparinized ABG syringe kit","23–25G short-bevel needle","2% CHG/70% alcohol prep swab","Ice slurry cup (for delayed transport)","Non-sterile gloves","Gauze + pressure dressing","Pre-labeled specimen syringe cap"],"steps":["Perform Modified Allen's Test: compress radial AND ulnar arteries simultaneously; patient opens/closes fist 10 times; release ulnar artery only — palm should flush pink within 6 seconds (positive = adequate collateral circulation).","Position wrist in hyperextension over a rolled towel. Palpate radial pulse at distal wrist lateral side.","Clean site with CHG-alcohol prep swab; allow to dry completely.","Insert needle bevel-up at 30–45° directly over the point of maximal pulsation. Arterial pressure auto-fills syringe with pulsatile blood flow.","Collect 1–3 mL. Activate safety mechanism; apply firm digital pressure immediately for ≥5 minutes (≥10 min if patient is anticoagulated).","Remove ALL air bubbles from syringe immediately. Cap syringe securely.","Place in ice slurry if laboratory transport will take >15–20 minutes.","Label with: patient ID, collection time, body temperature, FiO₂ or O₂ L/min, and ventilator mode.","Send to lab immediately (<15 min ideal; on ice if delayed). Document procedure, site, time, and clinical context."],"warnings":["Failed Allen's Test (collateral circulation inadequate): do NOT use the radial artery on that side — use the contralateral radial, femoral (physician), or brachial (physician) artery.","Arterial hematoma can compress the radial nerve: assess sensory function and hand motor strength after procedure.","NEVER sample from femoral artery without physician authorization, specific procedural training, and post-procedure monitoring protocol."],"notes":["Normal ABG values: pH 7.35–7.45; PaCO₂ 35–45 mmHg; PaO₂ 80–100 mmHg; HCO₃ 22–26 mEq/L; SaO₂ ≥95%.","ABG interpretation sequence: (1) pH → acidosis or alkalosis; (2) PaCO₂ → respiratory component; (3) HCO₃ → metabolic component; (4) compensation present?","Continuous arterial lines eliminate repeated punctures for frequent sampling in ICU patients."],"refs":["AARC Clinical Practice Guideline: Sampling for ABG Analysis (2001). Respir Care. 46(5):498–505.","Lippincott Nursing Procedures, 9th Ed (2022). pp 78–84.","Thalheimer M et al. (2019). ABG Interpretation for Nurses. Intensive Crit Care Nurs. 54:73–80."]},{"id":33,"cat":"central","icon":"🔗","title":"Central Venous Catheter (CVC) Dressing Change","summary":"Changing the sterile dressing at a CVC site to prevent CLABSI using chlorhexidine and aseptic technique.","equipment":["CVC dressing change kit (CHG-impregnated disc + transparent film dressing)","Sterile gloves","Surgical mask (for nurse and patient)","2% CHG/70% alcohol swab sticks","Additional transparent dressing","Ruler for external catheter length measurement","Label"],"steps":["Hand hygiene. Apply surgical mask. Instruct patient to also wear mask if able. Explain procedure.","Stabilize catheter with non-dominant hand THROUGHOUT the entire dressing change to prevent displacement.","Remove old dressing by peeling edges TOWARD insertion site (prevents accidental catheter retraction).","Inspect: erythema, discharge, tenderness, any catheter migration (compare measured external length to documented baseline).","Don sterile gloves.","Scrub insertion site with CHG swab sticks using friction for ≥30 seconds in back-and-forth motion; then circular motion outward. Allow to dry ≥30 seconds (do NOT fan dry).","Apply CHG-impregnated gel disc over insertion site if included in kit.","Apply transparent sterile film dressing firmly from center outward; no air pockets; completely occlusive.","Label: date, time, nurse initials. Change frequency: transparent dressings every 7 days; gauze dressings every 48 h; either immediately if soiled, loose, or damp.","Document: dressing change, site assessment findings, external catheter length measurement, and patient tolerance."],"warnings":["CHG is the standard-of-care antiseptic for CVC dressing changes (CDC 2017; INS 2021) — do NOT substitute povidone-iodine alone for routine maintenance care.","Any suspicion of CLABSI (unexplained fever, chills, rigors, purulence at insertion site) → 2 blood culture sets + notify physician → consider catheter removal.","All catheter accesses require CHG scrub of the needleless connector — laxity in scrub compliance is the primary modifiable CLABSI risk factor."],"notes":["CLABSI prevention bundle (CDC): hand hygiene + maximal sterile barriers at insertion + CHG skin prep + optimal site selection + daily catheter necessity reassessment.","Passive disinfection caps (70% IPA-impregnated) on all lumens reduce CLABSI by 28–86% — used in addition to (not instead of) active scrub.","Sutureless securement devices (e.g., StatLock) are preferred over sutures — lower CLABSI and catheter dislodgement rates."],"refs":["CDC (2011, updated 2017). Guidelines for the Prevention of Intravascular Catheter-Related Infections. cdc.gov.","INS Standards of Practice — Central Venous Access (2021). J Infus Nurs. 44(1S).","Lippincott Nursing Procedures, 9th Ed (2022). pp 143–152."]},{"id":34,"cat":"central","icon":"🔄","title":"CVC/PICC Flushing & Needleless Connector Change","summary":"Maintaining central line patency with standardized flush technique and scheduled needleless connector replacement.","equipment":["10 mL NS pre-filled syringe (minimum 10 mL to prevent excessive pressure)","Heparin lock flush per protocol (10–100 units/mL)","New sterile needleless connector (Luer-lock)","70% isopropyl alcohol swabs","Non-sterile gloves"],"steps":["Hand hygiene. Apply non-sterile gloves.","Scrub the needleless connector with 70% isopropyl alcohol using friction for ≥15 seconds. Allow to dry ≥15 seconds.","Attach 10 mL NS syringe. Unclamp lumen.","Flush with push-pause turbulent technique: inject 1 mL rapidly → brief pause → inject 1 mL → pause → repeat until 10 mL delivered.","Maintain positive pressure while clamping (close clamp while the last 0.5 mL is still being injected — varies by connector type).","For unused lumens: heparin-lock per institutional protocol (3–5 mL of 10 or 100 units/mL). Clamp.","To change connector: clamp lumen; scrub old connector one final time; remove; attach new sterile connector using aseptic no-touch technique.","Label new connector with date and time. Document flushing and connector change in nursing notes."],"warnings":["NEVER flush against resistance — may indicate catheter thrombosis or kinking; notify provider; consider alteplase (tPA) per protocol.","NEVER use syringes smaller than 10 mL for CVCs or PICCs — small syringes generate excessive pressure (>300 psi) that can fracture the catheter.","Needleless connectors must be changed: every 72–96 hours, with every blood product administration, and immediately when visibly contaminated or compromised."],"notes":["Alteplase (tPA) 2 mg/2 mL: instill into occluded lumen; dwell 30–120 min; aspirate and discard; flush — effective for catheter-associated thrombosis.","Passive disinfection caps left on between accesses passively disinfect the connector surface with 70% IPA.","INS 2021: positive-pressure flush technique and clamping sequence must match connector type — consult institutional protocol."],"refs":["INS Standards of Practice (2021). J Infus Nurs. 44(1S).","CDC (2017). Intravascular Catheter Infection Prevention Guidelines. cdc.gov.","Lippincott Nursing Procedures, 9th Ed (2022). pp 152–161."]},{"id":35,"cat":"central","icon":"📍","title":"PICC Line Assessment & Care","summary":"Maintaining peripherally inserted central catheter patency, monitoring for complications, and educating the patient.","equipment":["CVC dressing kit (CHG-based)","10 mL NS flush syringes","Centimeter ruler for external length measurement","Heparin lock per protocol"],"steps":["Assess external catheter length at each dressing change: compare measured cm to baseline insertion documentation (any change >2 cm suggests migration).","Inspect entire arm from insertion site to axilla: erythema, warmth, edema, superficial vein tracking, tenderness (signs of thrombophlebitis or DVT).","Dressing change using same CHG technique as CVC (Procedure #33): every 7 days or PRN.","Flush all lumens with 10 mL NS push-pause; heparin-lock unused lumens per protocol.","Confirm PICC tip position documentation on chart (radiologically confirmed at insertion; re-confirm if external length changes).","Educate patient: protect arm from trauma; no BP cuff on PICC arm; no tight sleeves; notify nurse immediately if arm becomes swollen, painful, or warm."],"warnings":["PICC migration is common — NEVER re-advance an externalized catheter (sterility is lost and tip position is unknown).","Upper extremity DVT occurs in 2–5% of PICC patients — duplex Doppler ultrasound if arm swelling, warmth, or pain develops.","PICC in antecubital fossa has higher thrombosis and infection rates — basilic or brachial veins are preferred insertion sites."],"notes":["PICCs can remain in place up to 12 months if maintained properly and clinical indication persists.","Correct tip position: distal third of the superior vena cava at the cavoatrial junction (SVC-CAJ) — confirmed by chest X-ray at insertion.","MAGIC criteria for PICC use (Chopra 2015): appropriate for: antibiotics ≥6 days; TPN; chemotherapy; irritant/vesicant infusions."],"refs":["INS Standards of Practice (2021). J Infus Nurs. 44(1S).","Lippincott Nursing Procedures, 9th Ed (2022).","Chopra V et al. (2015). MAGIC Criteria for PICC Selection. Ann Intern Med. 163(4):304–314."]},{"id":36,"cat":"ostomy","icon":"🟡","title":"Ostomy Pouching System Change (Colostomy/Ileostomy/Urostomy)","summary":"Replacing the ostomy pouching system to maintain stoma viability, periostomal skin integrity, and patient comfort.","equipment":["Ostomy measuring guide/template","Scissors","New wafer (skin barrier) + pouch (drainable or closed)","Barrier paste, strips, or rings","Skin barrier powder + barrier wipe (for denuded skin)","Warm water + soft washcloth","Waste bag","Non-sterile gloves"],"steps":["Gather all supplies before starting. Empty the pouch if drainable before removal.","Remove old wafer by supporting periostomal skin with one hand while peeling wafer away from skin in the opposite direction.","Assess stoma: color (normal = beefy red or pink), size, shape, mucocutaneous junction integrity.","Assess periostomal skin: erythema, erosion, fungal rash, hyperplasia, peristomal fistula.","Clean stoma and periostomal skin with warm water and soft washcloth; pat completely DRY — moisture impairs wafer adhesion.","Measure stoma with template. Trace and cut wafer opening 2–3 mm (1/8 in) larger than stoma (not too large — exposed skin erodes from effluent).","Crusting technique for denuded skin: apply barrier powder → barrier wipe → repeat 2–3 times to build a protective layer.","Warm wafer between hands for 30–60 seconds (improves adhesion by softening the adhesive).","Apply barrier paste or strip around the cut wafer opening. Remove backing; center wafer over stoma from bottom up. Press firmly for ≥60 seconds.","Attach and close pouch. Document stoma assessment and periostomal skin condition."],"warnings":["Stoma turning PURPLE, DUSKY, or BLACK = ischemia — IMMEDIATELY notify provider; do not wait.","Mucocutaneous separation (gap between stoma and skin edge) allows fecal contamination of wound — notify surgeon.","Do NOT cut wafer opening too large — exposed periostomal skin will erode rapidly, especially with ileostomy effluent (high enzymatic content)."],"notes":["Wafer change frequency: every 3–5 days; sooner if any leakage detected — ileostomy effluent causes rapid skin breakdown.","Ileostomy: high liquid output (800–1500 mL/day); high electrolyte loss risk (Na⁺, K⁺); monitor hydration and electrolytes.","WOCN referral: for stoma complications, poorly sited stoma, parastomal hernia, or patient/family education needs."],"refs":["WOCN Society (2018). Ostomy Care and Management Clinical Guideline. J Wound Ostomy Continence Nurs.","Lippincott Nursing Procedures, 9th Ed (2022). pp 585–597.","Salvadalena G et al. (2020). WOCN Society Position Statement on Stomal Complications. J Wound Ostomy Continence Nurs. 47(1)."]},{"id":37,"cat":"ostomy","icon":"💧","title":"Surgical Drain Management (JP, Hemovac, Blake)","summary":"Monitoring, emptying, and maintaining closed surgical drainage systems to sustain negative pressure and prevent infection.","equipment":["Non-sterile gloves","Graduated measuring container","Normal saline + gauze for site care","Adhesive dressing (split gauze + tape)","Documentation record"],"steps":["Identify drain type: Jackson-Pratt (JP — oval bulb), Hemovac (flat spring-loaded disc), or Blake (grooved round drain).","Assess exit site: erythema, separation, skin maceration, or excessive drainage around the tube.","Don non-sterile gloves. Empty drain when ½ to ¾ full.","JP emptying: open bulb cap fully; tilt and pour drainage into measuring cup; fully compress bulb before closing cap (restores negative pressure suction).","Hemovac emptying: open pour spout; pour drainage; flatten disc completely; close spout firmly to re-create suction.","Measure: record output volume, color, and consistency at each emptying and per-shift summary.","Clean exit site with NS-moistened gauze; apply fresh split-gauze dressing.","Confirm drain tubing is patent, unsecured from body (but secured to dressing), not kinked or under tension.","Document: per-emptying and cumulative shift volume, color, consistency, and site assessment."],"warnings":["Failure to recompress bulb/disc fully after emptying = loss of suction = seroma/hematoma formation = infection risk.","NEVER clamp or remove a surgical drain without explicit physician order.","Abrupt cessation of drainage (previously draining drain) may indicate drain occlusion, migration, or kinking — assess and notify surgeon."],"notes":["Normal drainage progression: sanguinous (first 24 h) → serosanguinous (days 1–3) → serous (days 3+) — each stage is expected.","Drain removal criteria: typically output <25–30 mL/24 hours for 2 consecutive days (per surgeon preference).","Chylous drainage (milky white after initiating oral feeds) from neck or thoracic drain indicates chyle leak — notify surgeon immediately."],"refs":["Lippincott Nursing Procedures, 9th Ed (2022). pp 245–253.","Durai R & Ng PC (2010). Surgical Vacuum Drains: Types, Uses, and Complications. AORN J. 91(2):266–271.","Toon CD et al. (2013). Early vs. Delayed Dressing Removal After Primary Closure of Surgical Wounds. Cochrane Database Syst Rev."]},{"id":38,"cat":"cardiac","icon":"❤️","title":"Adult Basic Life Support (BLS/CPR)","summary":"Providing high-quality chest compressions and rescue breathing to adults in cardiac arrest per 2020 AHA guidelines.","equipment":["Personal protective equipment (gloves + face shield)","Pocket mask or BVM with O₂","AED (retrieve immediately)"],"steps":["Ensure scene safety. Tap shoulders firmly and shout: \"Are you okay? Can you hear me?\"","If unresponsive + no normal breathing (agonal gasps count as no breathing): SIMULTANEOUSLY activate emergency response system (call code/911) AND retrieve AED.","Begin chest compressions: heel of dominant hand on LOWER HALF of sternum; lock elbows; lean directly over patient.","Compress 5–6 cm (2–2.4 inches) deep with FULL chest recoil between compressions.","Rate: 100–120 compressions per minute. Minimize interruptions — each pause >10 s reduces survival.","30 compressions: 2 rescue breaths for single-rescuer adult BLS. Each breath delivered over 1 second with visible chest rise.","AED: power ON → apply pads (right subclavicular + left lateral chest at V5–V6 level) → stand clear → ANALYZE → follow prompts.","If SHOCK ADVISED: clear patient → deliver shock → IMMEDIATELY resume CPR starting with compressions.","Switch compressors every 2 minutes (at rhythm check) to maintain compression quality.","Continue until: ROSC (return of spontaneous circulation), ACLS team takes over, or resuscitation terminated."],"warnings":["Interruptions >10 seconds significantly reduce coronary perfusion pressure and survival — minimize all pauses.","Hands-only CPR (compressions only) is recommended for untrained bystanders or when unwilling to give rescue breaths.","Over-ventilation during CPR impairs venous return and worsens hemodynamics — give only enough breath for visible chest rise."],"notes":["CPR quality indicators: visible full chest recoil; compression depth 5–6 cm; rate 100–120/min; CPR fraction (time spent compressing) >80%.","Two-rescuer adult CPR: 30:2 until advanced airway placed; then asynchronous continuous compressions at 100–120/min + 1 breath every 6 seconds.","ETCO₂ during CPR: <10 mmHg = inadequate compressions; sudden rise to >35–40 mmHg = likely ROSC."],"refs":["American Heart Association (2020). BLS Provider Manual. AHA, Dallas, TX.","Panchal AR et al. (2020). 2020 AHA Guidelines for CPR and ECC: Part 3 Adult BLS. Circulation. 142(16 Suppl 2):S366–S468.","European Resuscitation Council (ERC) Guidelines (2021). Resuscitation."]},{"id":39,"cat":"cardiac","icon":"⚡","title":"Defibrillation — Manual & AED","summary":"Delivering therapeutic electrical shock to terminate ventricular fibrillation or pulseless ventricular tachycardia.","equipment":["Defibrillator (manual) or AED (automated)","Self-adhesive electrode pads (preferred over paddles)","Conductive gel (if using paddles)","Cardiac monitor"],"steps":["Confirm pulseless cardiac arrest: unresponsive + no pulse + monitor showing VF or pVT.","Continue CPR while defibrillator is being retrieved and pads are being applied.","Apply pads: APEX-STERNAL (anterior-lateral placement): right infraclavicular → left lateral chest at V5–V6 axillary level. Alternative: anterior-posterior placement if needed.","Charge to prescribed energy: biphasic 120–200 J (per device manufacturer); monophasic 360 J.","Call \"CLEAR\" loudly. Perform visual sweep: confirm NO one is in contact with patient, bed, or connected equipment.","Deliver shock. IMMEDIATELY resume CPR beginning with chest compressions — do NOT delay to check rhythm.","After 2 minutes of CPR: analyze rhythm. Repeat shock if VF/pVT persists; continue 2-minute CPR cycles.","Document each shock: time, energy used, pre-shock and post-shock rhythm, and patient response."],"warnings":["Physical contact with patient during shock delivery: any rescuer in contact receives a potentially lethal electrical shock — CLEAR check is non-negotiable.","Implanted pacemakers/ICDs: place pad ≥8 cm (3 in) away from device generator — direct pad placement over device reduces shock efficacy.","Defibrillation has NO role for asystole or PEA — focus on CPR quality and identification/treatment of reversible causes (5Hs and 5Ts)."],"notes":["Time from VF detection to first shock should be <2 minutes in all monitored clinical settings.","Synchronized cardioversion differs from defibrillation: used for VT with a pulse, Afib, or SVT — synchronizes shock delivery to the QRS complex.","5Hs: Hypoxia, Hypovolemia, Hydrogen ion (acidosis), Hypo/Hyperkalemia, Hypothermia; 5Ts: Tension pneumothorax, Tamponade, Toxins, Thrombosis (pulmonary/coronary), Trauma."],"refs":["AHA (2020). ACLS Provider Manual. American Heart Association.","Lippincott Nursing Procedures, 9th Ed (2022). pp 210–220.","Link MS et al. (2015). Adult Advanced Cardiovascular Life Support. Circulation. 132(18 Suppl 2):S444–464."]},{"id":40,"cat":"cardiac","icon":"📡","title":"Telemetry Monitoring & Basic Rhythm Interpretation","summary":"Setting up continuous telemetry and systematically interpreting cardiac rhythms for early recognition of life-threatening arrhythmias.","equipment":["Telemetry transmitter unit","3-lead or 5-lead electrode set with pre-gelled electrodes","Alcohol prep pads","Central monitoring station access"],"steps":["Explain telemetry monitoring purpose to patient. Prepare skin per electrode placement protocol.","Apply electrodes and connect to telemetry transmitter lead wires.","Confirm signal transmission quality at central monitoring station.","Select lead with clearest P-wave and QRS complex (usually Lead II for most patients).","Set individualized alarm limits: HR high and low (based on patient baseline, not generic defaults).","Perform rhythm strip analysis at admission, every 8 hours, and with any clinical change.","Systematic 6-step rhythm analysis: (1) Rate; (2) Regularity; (3) P waves present and consistent?; (4) PR interval (normal 0.12–0.20 s)?; (5) QRS width (normal <0.12 s)?; (6) QT interval assessment.","Recognize CRITICAL rhythms requiring immediate action: VF, pVT, Asystole, Complete Heart Block (3rd degree), Torsades de Pointes, SVT with hemodynamic instability."],"warnings":["Artifact from patient movement or electrode displacement can mimic VF — ALWAYS assess patient clinically before initiating any emergency response.","Alarm fatigue (TJC National Patient Safety Goal): individualize alarm parameters and respond to every alarm — silence without assessment is never acceptable.","A paced rhythm appearing on the monitor may still indicate hemodynamic compromise — assess patient clinically, not monitor data alone."],"notes":["Normal sinus rhythm: regular rate 60–100 bpm; P wave before every QRS; PR interval 0.12–0.20 s; QRS <0.12 s.","Afib: most common sustained arrhythmia; irregularly irregular rhythm; no discrete P waves; variable QRS rate — rate control goal HR <110 bpm at rest.","QTc prolongation >500 ms with QT-prolonging drugs: haloperidol, azithromycin, methadone, fluoroquinolones — notify provider and consider drug substitution."],"refs":["Drew BJ et al. (2004). AHA Practice Standards for ECG Monitoring in Hospital Settings. Circulation. 110(17):2721–2746.","Lippincott Nursing Procedures, 9th Ed (2022).","AACN Practice Alert: Alarm Management (2013). Crit Care Nurse."]},{"id":41,"cat":"cardiac","icon":"🔩","title":"Arterial Line (A-Line) Assessment & Management","summary":"Managing an indwelling arterial catheter for continuous blood pressure monitoring and repeated ABG sampling in ICU patients.","equipment":["Arterial pressure transducer set","500 mL NS pressurized bag at 300 mmHg","IV pressure pole and transducer holder","Bedside hemodynamic monitor","Phlebostatic axis reference point (level)"],"steps":["Zero the transducer to atmospheric pressure: level transducer at phlebostatic axis (4th ICS, midaxillary line); open stopcock to air; press ZERO on monitor; close stopcock.","Re-zero whenever: patient position changes, system is disrupted, or readings are clinically inconsistent.","Assess arterial waveform quality: sharp upstroke, clear dicrotic notch, gradual diastolic run-off.","Assess insertion site and distal extremity every 4 hours: color, warmth, cap refill (normal <2 s), sensation, and movement distal to catheter.","Perform fast-flush square-wave test: briefly activate flush; observe square wave → 1–2 oscillations → rapid return to baseline = optimal dynamic response.","Verify pressure bag maintained at 300 mmHg for continuous 3 mL/h flush rate.","Blood sampling: waste 5–10 mL first; collect specimen; flush line with NS after sampling.","Document: waveform quality, BP values, distal limb assessment, every 4 hours."],"warnings":["Air in the arterial line = ARTERIAL AIR EMBOLISM = stroke risk — close stopcock IMMEDIATELY; aspirate to remove air; call physician.","Disconnection of arterial line = rapid, potentially lethal hemorrhage — apply immediate direct pressure; call for help.","NEVER infuse medications through an arterial line — causes arterial necrosis and distal limb ischemia."],"notes":["Phlebostatic axis: 4th ICS at midaxillary line — standard reference point for ALL hemodynamic transducers.","Over-damped waveform (slurred, rounded): air bubble, blood clot, or kink in tubing → falsely low systolic/high diastolic reading.","Under-damped waveform (excessive oscillations/ringing): falsely HIGH systolic reading → resonance problem; check catheter and tubing setup."],"refs":["AACN (2009). Practice Alert: Pulmonary Artery/Arterial Pressure Monitoring. aacn.org.","Lippincott Nursing Procedures, 9th Ed (2022). pp 56–70.","Pittman JA et al. (2004). Arterial and Central Venous Pressure Monitoring. Int Anesthesiol Clin. 42(1):13–30."]},{"id":42,"cat":"neuro","icon":"🧠","title":"Glasgow Coma Scale (GCS) Assessment","summary":"Objective, reproducible quantification of conscious level using eye, verbal, and motor response components.","equipment":["Penlight (for pupil assessment)","Sternal rub or trapezius pinch (noxious stimulus for motor testing)","GCS documentation record"],"steps":["Eye Opening (E): Spontaneous eye opening = 4; Opens to voice = 3; Opens to pain = 2; No eye opening = 1.","Verbal Response (V): Oriented (knows name, place, date) = 5; Confused conversation = 4; Inappropriate words = 3; Incomprehensible sounds = 2; No verbal response = 1.","Motor Response (M): Obeys commands = 6; Localizes pain (purposeful reach) = 5; Withdrawal from pain = 4; Abnormal flexion (decorticate) = 3; Abnormal extension (decerebrate) = 2; No motor response = 1.","Sum all three: E + V + M = GCS Total Score (minimum 3; maximum 15).","Assess PUPILS simultaneously: size (mm), equality, and direct/consensual light reactivity. Normal = PERRL (Pupils Equal, Round, Reactive to Light).","Assess limb movement: strength and symmetry in all four extremities.","Compare to previous GCS score: a change of ≥2 points OR new pupil asymmetry ≥1 mm is clinically significant — notify provider immediately.","For intubated patients: score V component as \"T\" (tube): e.g., E3VTM5 — document contributing factors affecting score."],"warnings":["GCS ≤8 correlates with inability to protect the airway — prepare for possible urgent intubation (have equipment at bedside).","Unilateral pupil dilation (mydriasis) with sluggish reactivity = uncal herniation until proven otherwise — STAT CT head and neurosurgery notification.","Sedation, paralytics, and metabolic encephalopathy confound GCS — document these factors alongside the score."],"notes":["GCS severity: 14–15 = mild injury; 9–13 = moderate injury; 3–8 = severe brain injury.","In TBI: serial GCS assessment every 1 hour for the first 24 hours in moderate-to-severe cases.","Anisocoria: normal pupil size difference up to 1 mm; >1 mm new-onset difference is pathological until proven otherwise."],"refs":["Teasdale G & Jennett B (1974). Assessment of Coma and Impaired Consciousness: A Practical Scale. Lancet. 2(7872):81–84.","Lippincott Nursing Procedures, 9th Ed (2022). pp 397–402.","AANN (2021). Clinical Practice Guideline: Assessment of Neurological Conditions in Adults."]},{"id":43,"cat":"neuro","icon":"🔦","title":"NIH Stroke Scale (NIHSS) & Stroke Assessment","summary":"Performing a structured neurological assessment for stroke recognition, deficit quantification, and treatment decision-making.","equipment":["Penlight","Tongue depressor","NIHSS scoring tool (printout or electronic)","Cotton swab (sensory testing)","Reflex hammer"],"steps":["Level of Consciousness (LOC): alertness; orientation (year, month); follow commands (open/close eyes, make fist).","Gaze: conjugate horizontal eye deviation; assess full horizontal gaze excursion bilaterally.","Visual fields: confrontation testing in all 4 quadrants; homonymous hemianopia detection.","Facial movement: \"Show me your teeth and close your eyes\" — assess symmetry of lower and upper face.","Arm motor: outstretched arms at 90° (seated) or 45° (supine) for 10 seconds — observe drift, effort, and gravity collapse.","Leg motor: 30° elevation supine for 5 seconds — observe drift and gravity collapse.","Limb ataxia: finger-nose-finger and heel-shin-shin coordination tests.","Sensory: sharp vs. dull pin-prick discrimination on face, arm, and leg bilaterally.","Language: name objects, repeat phrases, follow three-step command.","Dysarthria: rate articulation clarity: \"mama,\" \"tip-top,\" \"fifty-fifty.\"","Extinction/Inattention: simultaneous bilateral stimulation (visual and tactile).","Sum NIHSS score (0–42). Report new or worsening deficits ≥2 points immediately."],"warnings":["Any sudden focal neurological deficit = STROKE until proven otherwise → STROKE ALERT immediately → Non-contrast CT STAT → thrombolysis/thrombectomy decision within 4.5 hours of symptom onset.","Posterior circulation strokes (vertebrobasilar): may present without obvious motor deficits — include vertigo, diplopia, dysphagia, ataxia, and LOC changes in assessment.","Timing is critical: EVERY minute of delay without treatment costs ~1.9 million neurons, 13.8 billion synapses (Saver 2006)."],"notes":["FAST mnemonic: Face drooping, Arm weakness, Speech difficulty, Time to call emergency services.","Door-to-needle time (IV alteplase): goal ≤60 min; door-to-puncture (endovascular): goal ≤90 min.","NIHSS ≥6 = moderate-to-severe stroke; may be candidate for mechanical thrombectomy (DAWN/DEFUSE-3 trial criteria)."],"refs":["Brott T et al. (1989). Measurements of Acute Cerebral Infarction: A Clinical Examination Scale. Stroke. 20(7):864–870.","AHA/ASA (2019). 2019 Update to the Early Management of Acute Ischemic Stroke Guidelines. Stroke. 50(12).","Lippincott Nursing Procedures, 9th Ed (2022). pp 390–397."]},{"id":44,"cat":"neuro","icon":"🛏️","title":"Safe Patient Handling, Transfer & Repositioning","summary":"Moving, turning, and transferring patients safely to prevent patient injury and occupational musculoskeletal harm.","equipment":["Friction-reducing sheet or slide board","Gait/transfer belt","Mechanical lift (Hoyer or ceiling track) for dependent patients","Foam wedge pillows and positioning aids","Minimum 2 staff for all dependent patient movements"],"steps":["Assess: patient weight, mobility level and ability to assist, presence of pain, lines/tubes/drains, and orthostatic risk.","Determine staffing needed: minimum 2 staff for all dependent or near-dependent patients; use mechanical lift for patients >35 kg who cannot assist.","Raise bed to nurse's hip (waist) level to prevent spinal loading during lateral work.","Lower HOB flat (unless contraindicated by clinical condition) for repositioning in bed.","Log-roll technique for spinal precautions: 3 staff — one stabilizes head/neck in neutral; one at thorax/pelvis; one at lower extremities; move patient as one synchronized unit on count of 3.","Lateral repositioning: 30° tilt preferred over 90° side-lying (reduces trochanter pressure by 60%).","After repositioning: verify patient comfort, restore HOB to prescribed degree, confirm no lines/tubes kinked or under tension.","Document position change time and skin/pressure point assessment findings."],"warnings":["Solo transfer of a dependent patient >35 kg without mechanical assist device violates OSHA ergonomics guidelines and increases staff injury risk.","Log roll is MANDATORY for ALL patients with suspected or confirmed spinal injury until radiological clearance.","Repositioning schedules must be consistently followed: every 2 hours in bed; every 1 hour in chair — missed turns are the primary cause of new facility-acquired pressure injuries."],"notes":["30° lateral tilt with foam wedge: reduces trochanteric pressure compared to 90° side-lying; achieves both patient comfort and pressure redistribution.","Friction-reducing draw sheets decrease shear force during lateral repositioning by up to 60%.","Common repositioning positions: Semi-Fowler's 30–45° (default); High-Fowler's 60–90° (respiratory/post-op); Reverse Trendelenburg (GERD/aspiration risk); Prone (severe ARDS)."],"refs":["OSHA (2013). Guidelines for Nursing Homes: Ergonomics for the Prevention of Musculoskeletal Disorders. osha.gov.","Waters TR (2007). When Is It Safe to Manually Lift a Patient? Am J Nurs. 107(8):53–58.","Lippincott Nursing Procedures, 9th Ed (2022). pp 453–462."]},{"id":45,"cat":"hygiene","icon":"🧴","title":"Hand Hygiene — WHO 5 Moments & Correct Technique","summary":"The single most effective infection prevention intervention — correct hand hygiene technique and application at the right moments.","equipment":["Alcohol-based hand rub (ABHR) — 60–95% ethanol or isopropanol","Antimicrobial soap + water (for visible soiling or C. difficile/norovirus exposure)","Paper towels","Nail brush (if nails heavily contaminated)"],"steps":["WHO 5 Moments: ① Before patient contact; ② Before aseptic procedure; ③ After body fluid exposure risk; ④ After patient contact; ⑤ After contact with patient surroundings.","ABHR technique: apply 1–2 pumps to palm; palm-to-palm rub; right palm over left dorsum with interlaced fingers; left palm over right dorsum; palm-to-palm fingers interlaced; backs of fingers to opposing palms; circular rub of each thumb; fingertip-to-palm rub each hand; rub until completely dry (minimum 20 seconds).","Soap & water technique: wet hands with warm water; apply antimicrobial soap; use WHO 6-step technique for ≥40–60 seconds total; rinse thoroughly under running water; dry with paper towel; use towel to close faucet.","Use ABHR for routine decontamination when hands are NOT visibly soiled.","Use soap and water for: visibly soiled hands, Clostridioides difficile or norovirus exposures, before eating, after toilet use."],"warnings":["ABHR does NOT eliminate C. difficile or norovirus spores — soap and water MANDATORY for these pathogens.","Rings, bracelets, and wristwatches harbor bacteria beneath them — remove all jewelry before patient care.","Long nails and artificial nails harbor more gram-negative bacteria under the nail plate — removed or banned in clinical settings (CDC)."],"notes":["Hand hygiene compliance worldwide averages only 40% — structured auditing with real-time feedback is the most effective improvement strategy.","ABHR minimum duration: 20 seconds for effective decontamination; soap and water minimum: 40–60 seconds.","Proper hand hygiene could prevent up to 50% of all healthcare-associated infections (WHO 2009 estimate)."],"refs":["WHO (2009). WHO Guidelines on Hand Hygiene in Health Care. WHO Press, Geneva.","CDC (2002, updated 2019). Guideline for Hand Hygiene in Health-Care Settings. MMWR. 51(RR-16).","Lippincott Nursing Procedures, 9th Ed (2022). pp 5–12."]},{"id":46,"cat":"hygiene","icon":"🛡️","title":"Personal Protective Equipment (PPE) — Donning & Doffing","summary":"Correctly applying and removing PPE to protect the healthcare worker and prevent cross-contamination to other patients.","equipment":["Non-sterile gloves (nitrile preferred)","Isolation gown (fluid-resistant)","Surgical mask OR N95 respirator (per precaution type)","Goggles or face shield","Shoe covers / head cover (if required by procedure)"],"steps":["DONNING ORDER: 1. Hand hygiene → 2. Gown (tie securely at back) → 3. Mask or N95 respirator (fit-check) → 4. Goggles/face shield → 5. Gloves (extend cuffs over gown sleeves).","N95 fit check: positive pressure test (cover exhalation valve, exhale — mask should puff out) or negative pressure test (cover both valves, inhale — mask should collapse slightly).","DOFFING ORDER (most contaminated to least contaminated): 1. Gloves (roll outside in, avoid touching skin) → 2. Goggles/face shield (handle by strap/sides only, place in bin) → 3. Gown (unfasten ties, peel from shoulders inward rolling away from body) → 4. Mask/respirator (handle by ties/straps only — do NOT touch front). Hand hygiene after each step.","Perform final hand hygiene after ALL PPE is removed.","All PPE must be removed BEFORE exiting the patient's room."],"warnings":["The FRONT of all PPE (especially the mask and gown front) is considered HIGHLY CONTAMINATED — handle ONLY by straps, ties, and edges during doffing.","N95 respirators require annual fit testing per OSHA 29 CFR 1910.134 — a poorly fitting N95 provides no better protection than a surgical mask.","Reusing single-use PPE is NOT standard of care (except during crisis standards of care/shortage protocols) — report all supply shortages."],"notes":["Transmission-based precautions: Contact (gown + gloves); Droplet (surgical mask + gloves ± gown); Airborne (N95 + negative pressure room + gown + gloves).","Eye protection reduces mucosal bloodborne pathogen exposure by >70% — mandatory for all splash or splatter risk procedures.","Studies show that DOFFING is the highest-risk step for contamination — slow, deliberate technique reduces self-contamination significantly."],"refs":["CDC (2020). Sequence for Donning and Doffing PPE. cdc.gov/niosh.","WHO (2020). Rational Use of PPE for COVID-19. WHO/2019-nCoV/IPC/PPE_use/2020.4.","OSHA 29 CFR 1910.134 — Respiratory Protection Standard."]},{"id":47,"cat":"hygiene","icon":"🚧","title":"Transmission-Based Isolation Precautions","summary":"Implementing contact, droplet, or airborne isolation precautions to prevent pathogen transmission beyond standard precautions.","equipment":["Isolation signage (correct type)","Contact: gloves + gown","Droplet: surgical mask + gloves (± gown)","Airborne: N95 + negative pressure room + gown + gloves","Dedicated patient equipment per room"],"steps":["Identify isolation category from pathogen or suspected diagnosis (see notes).","Place isolation sign on patient room door BEFORE entering.","Don appropriate PPE BEFORE entering the room.","Dedicate all non-critical equipment to the patient's room: stethoscope, BP cuff, thermometer, pulse oximeter.","Limit patient transport outside room to medically essential procedures only.","When patient transport is required: apply appropriate masking to patient (surgical mask for droplet/airborne); notify receiving department of isolation status.","Perform hand hygiene on entering AND exiting the room. For C. difficile: soap and water required INSIDE room before exiting.","Doff all PPE in correct order in anteroom or just outside doorway. Perform final hand hygiene immediately after."],"warnings":["Lapses in isolation precautions are the primary cause of horizontal pathogen spread in hospital settings.","C. difficile: spores survive on environmental surfaces for >5 months; only sporicidal (bleach-based) disinfectants are effective; ABHR is NOT effective.","Airborne precautions require negative pressure rooms with ≥12 air changes per hour (AIA/FGI 2014 guidelines)."],"notes":["Contact precautions: MRSA, VRE, C. difficile, scabies, draining wounds, RSV (pediatric).","Droplet precautions: influenza, pertussis, COVID-19 (non-aerosol-generating), bacterial meningitis.","Airborne precautions: pulmonary/laryngeal TB, measles, varicella/disseminated zoster, monkeypox, COVID-19 (during aerosol-generating procedures).","Protective (reverse) isolation: severely immunocompromised patients (BMT, absolute neutrophil count <500/μL)."],"refs":["CDC/HICPAC (2007). Guideline for Isolation Precautions: Preventing Transmission of Infectious Agents in Healthcare Settings. cdc.gov.","Siegel JD et al. (2007). 2007 Guideline for Isolation Precautions. Infect Control Hosp Epidemiol. 28(S1).","Lippincott Nursing Procedures, 9th Ed (2022). pp 416–432."]},{"id":48,"cat":"hygiene","icon":"🦷","title":"Oral Hygiene — Hospitalized Patients & VAP Prevention Bundle","summary":"Providing structured oral hygiene to prevent ventilator-associated pneumonia (VAP) and maintain oral tissue health.","equipment":["Soft toothbrush","0.12% chlorhexidine gluconate (CHG) solution — for intubated patients only","Fluoride toothpaste","Oral suction catheter or Yankauer","Non-sterile gloves","Petroleum jelly or oral moisturizer for lips"],"steps":["Elevate HOB to 30–45° (or lateral position if unable to maintain elevation).","Assess oral cavity: mucosa, lips, tongue, teeth/dentures, debris, odor, lesions.","Intubated patients: suction oropharynx BEFORE oral care to remove pooled secretions that accumulate above the ETT cuff.","Brush all tooth surfaces, gums, and tongue: 2 minutes with soft toothbrush using gentle circular motion.","Rinse with 0.12% CHG solution for mechanically ventilated patients per VAP bundle protocol.","Suction oral cavity thoroughly after rinsing.","Apply moisturizer to lips and oral mucosa.","For non-intubated patients: assist with brushing twice daily; mouthwash rinse twice daily if swallowing is intact.","Document: oral cavity assessment findings and care provided."],"warnings":["CHG 0.12% oral rinse is only recommended for intubated ICU patients — recent evidence (2016 Cochrane) shows no benefit in non-ventilated patients and possible harm.","Aspiration of oral secretions is the primary mechanism of VAP — suction BEFORE oral care is critical for intubated patients.","Foam oral swabs alone are INSUFFICIENT for plaque removal — use a toothbrush whenever possible."],"notes":["VAP bundle (IHI/AACN): HOB elevation 30–45° + oral CHG + daily sedation vacation + daily weaning assessment + subglottic secretion drainage + VTE prophylaxis.","Oral care frequency: every 4 hours for ICU/ventilated patients; every 8–12 hours for general ward patients.","Xerostomia (dry mouth): common with O₂ therapy and mouth breathing — frequent moistening and artificial saliva products required."],"refs":["AACN (2017). VAP Prevention Practice Alert. Crit Care Nurse. 37(3).","Shi Z et al. (2013). Oral Hygiene Care for Critically Ill Patients to Prevent VAP. Cochrane Database Syst Rev.","Lippincott Nursing Procedures, 9th Ed (2022). pp 588–594."]},{"id":49,"cat":"hygiene","icon":"🚿","title":"Complete Bed Bath & Perineal Care","summary":"Providing thorough cleansing to dependent patients for hygiene, comfort, and comprehensive skin assessment.","equipment":["Basin with warm water 41–46°C (106–115°F)","No-rinse 2% CHG bath wipes (ICU preferred) or mild pH-balanced soap + washcloths","Bath blanket","Clean gown and fresh linens","Unscented lotion","Non-sterile gloves"],"steps":["Provide privacy. Explain procedure. Check water temperature on inner wrist before applying to patient.","Use bath blanket to drape unexposed areas throughout the procedure.","Sequence: eyes (inner to outer canthus, new cloth each eye) → face → neck → ears → far arm → near arm → chest/axillae → abdomen → far leg → near leg → feet → back → perineum (always last).","Use a clean area of the washcloth for each new stroke; change washcloths frequently.","Pat dry gently — do NOT vigorously rub; inspect all skin surfaces during drying.","Female perineal care: separate labia; clean from pubic symphysis TOWARD rectum (anterior to posterior); never from rectum forward.","Male perineal care: retract foreskin (if intact); cleanse glans in circular motion outward; replace foreskin COMPLETELY after cleaning (prevents paraphimosis).","Apply lotion to dry areas (avoid between toes — promotes fungal growth).","Change gown and bed linens. Reposition. Document any new skin findings."],"warnings":["Never leave an unconscious or confused patient unattended during bathing in or near water.","Do NOT massage reddened bony prominences — worsens ischemic pressure injury.","Failure to replace foreskin after male perineal care can cause PARAPHIMOSIS (painful constriction requiring emergency treatment)."],"notes":["ICU patients: daily 2% CHG bath cloths reduce CLABSI by 25% and CAUTI by 26% (Noto et al., JAMA 2015).","CHG baths: apply and allow to air-dry — do NOT rinse off; efficacy depends on residual CHG remaining on skin.","Report any unexpected findings during bathing: unexplained bruising, lacerations, or unusual marks may indicate accidental or intentional injury."],"refs":["Noto MJ et al. (2015). Chlorhexidine Bathing and Health Care-Associated Infections. JAMA. 313(4):369–378.","Lippincott Nursing Procedures, 9th Ed (2022). pp 28–42.","CDC (2013). Strategies to Prevent CLABSI in Acute Care Hospitals. Infect Control Hosp Epidemiol. 35(S2)."]},{"id":50,"cat":"hygiene","icon":"🦿","title":"VTE Prophylaxis — Sequential Compression Devices & Anticoagulants","summary":"Implementing mechanical and pharmacological venous thromboembolism prevention in hospitalized patients.","equipment":["Sequential compression device (SCD) pump + leg sleeves (knee-high or thigh-high)","Tape measure for accurate sleeve sizing","Prescribed anticoagulant (UFH, enoxaparin, fondaparinux) as ordered","Caprini or hospital-approved VTE risk assessment tool"],"steps":["Assess VTE risk at admission using a validated scoring tool (Caprini score or institutional equivalent). Document risk level.","Apply SCDs: measure calf circumference → select correct sleeve size → wrap smoothly from ankle to knee → connect securely to pump.","Activate pump; verify sequential inflation cycle (distal-to-proximal compression: foot → calf → thigh).","SCD usage: wear whenever patient is in bed or chair; remove ONLY for ambulation, bathing, or skin assessment.","Administer pharmacological prophylaxis as prescribed: enoxaparin SC (40 mg once daily standard medical/surgical dose) or UFH 5000 units SC q8–12h.","Encourage and facilitate EARLY AMBULATION — the highest-priority VTE prevention intervention post-surgery.","Educate patient: report calf pain, swelling, warmth, or new leg redness immediately.","Assess lower extremity daily: warmth, swelling, tenderness, skin color changes."],"warnings":["SCDs are CONTRAINDICATED in: active DVT/PE (risk of embolization), severe peripheral arterial insufficiency, open leg wounds or skin grafts on legs.","NEVER apply SCDs to legs with confirmed or suspected DVT — use pharmacological anticoagulation only.","Enoxaparin requires dose adjustment or avoidance in renal impairment (CrCl <30 mL/min) — anti-Xa monitoring may be required."],"notes":["VTE is the most preventable cause of hospital death — estimated 300,000 deaths/year in the US (AHRQ).","Virchow's Triad: Venous stasis + Endothelial injury + Hypercoagulability = VTE formation.","Wells DVT Score ≥2 = high probability → compress Doppler ultrasound before starting therapeutic anticoagulation.","LMWH (enoxaparin) is standard of care for most medical-surgical patients; fondaparinux preferred in HIT history."],"refs":["Guyatt GH et al. (2012). Antithrombotic Therapy and VTE Prevention: 9th Ed ACCP Guidelines. Chest. 141(2 Suppl).","Lippincott Nursing Procedures, 9th Ed (2022).","AHRQ (2022). Preventing Hospital-Associated Venous Thromboembolism: A Guide for Effective Quality Improvement. ahrq.gov."]},{"id":51,"cat":"hygiene","icon":"🧼","title":"Sterile Field Preparation & Sterile Glove Application","summary":"Establishing and maintaining a sterile field for invasive procedures using surgical aseptic technique.","equipment":["Sterile procedure pack or tray","Sterile drapes","Sterile gloves (correct size)","Sterile additional supplies as needed","70% alcohol hand preparation","Surgical mask"],"steps":["Apply surgical mask. Perform thorough hand hygiene.","Open outer packaging of sterile field supplies using 1-inch rule (only outer edge is non-sterile).","Create sterile field: open sterile drape from center outward without crossing over the sterile field.","Add supplies to field: grasp non-sterile outer packaging; hold above field; allow sterile contents to drop/fall onto field — do NOT reach over the sterile field.","Sterile glove application (closed technique): pick up first glove from inside cuff (touching only inner surface); pull onto hand; pick up second glove from outside (sterile-to-sterile); pull on.","Adjust gloves by interlocking fingers once both are on — never touch non-sterile surfaces.","Maintain sterile field awareness: never reach behind you; always face the sterile field; keep sterile gloved hands above waist level and in front of body.","Any break in sterile technique (contamination event): declare it immediately; replace contaminated items."],"warnings":["Any area of the sterile field that becomes wet, torn, or touches a non-sterile surface is considered CONTAMINATED — replace immediately.","Edge rule: the 2.5 cm (1 inch) border of any sterile field is considered contaminated — work only within the center.","Sterile gloves that touch non-sterile objects, or a non-sterile person touching the sterile field, require immediate replacement of contaminated items."],"notes":["Sterile field is time-limited — do not set up more than necessary time before procedure begins.","Airborne contamination increases with time, traffic, and air currents — minimize room traffic during sterile procedures.","Open technique vs. closed technique: closed technique (glove-to-glove, hand-to-hand) is preferred for aseptic sterile glove application."],"refs":["Lippincott Nursing Procedures, 9th Ed (2022). pp 13–22.","Perry AG et al. Clinical Nursing Skills & Techniques, 10th Ed (2022). Elsevier.","Association of periOperative Registered Nurses (AORN). Guideline for Sterile Technique (2023). aorn.org."]},{"id":52,"cat":"meds","icon":"💉","title":"Intradermal (ID) Injection — PPD Tuberculin Skin Test (Mantoux)","summary":"Injecting 0.1 mL of tuberculin purified protein derivative intradermally to screen for latent Mycobacterium tuberculosis infection.","equipment":["1 mL tuberculin syringe","26–27G short-bevel needle (3/8–1/2 in)","0.1 mL tuberculin PPD (5 TU/0.1 mL)","70% alcohol swab","Non-sterile gloves","Skin marking pen for site identification"],"steps":["Verify physician order. Explain the test procedure and the need to return in 48–72 hours for reading.","Select site: inner (volar) forearm, 4 finger-widths below the antecubital fossa; avoid areas of hair, scars, tattoos, or veins.","Cleanse with 70% alcohol; allow to dry completely.","Hold skin taut with non-dominant hand. Hold syringe nearly parallel to skin at 5–15° bevel-up.","Advance needle just until bevel is covered by dermis (only 3–4 mm insertion depth).","Inject 0.1 mL SLOWLY — a pale, raised bleb (wheal) of 6–10 mm MUST appear (confirms intradermal placement).","Withdraw needle at the same angle. Do NOT massage (disperses antigen).","Circle injection site with pen; instruct patient on return date (48–72 hours for PPD reading).","At 48–72 hours: measure induration (firmness, NOT erythema) in the transverse (perpendicular to arm axis) direction in millimeters."],"warnings":["If no wheal forms: needle was subcutaneous — withdraw, select a new site ≥5 cm away, and repeat; subcutaneous injection invalidates the test.","NEVER massage the injection site — disperses PPD antigen into surrounding tissue and invalidates the test.","Anaphylaxis has been reported with tuberculin administration — epinephrine 0.3 mg IM (anterolateral thigh) must be available."],"notes":["PPD interpretation by risk category: ≥5 mm positive for HIV-positive, recent TB contacts, immunosuppressed; ≥10 mm for healthcare workers, immigrants, homeless, prisoners; ≥15 mm for low-risk general population.","BCG-vaccinated individuals may have false-positive PPD — use IGRA (QuantiFERON-TB Gold or T-SPOT.TB) as preferred test in BCG-vaccinated persons.","Booster phenomenon: a second PPD 1–3 weeks after a negative PPD may boost a positive response in previously sensitized persons — used in healthcare worker two-step testing."],"refs":["CDC (2020). Testing for Latent TB Infection in the United States. cdc.gov/tb.","Lippincott Nursing Procedures, 9th Ed (2022). pp 540–545.","American Thoracic Society (2000). Diagnostic Standards and Classification of TB. Am J Respir Crit Care Med. 161(4):1376–1395."]}]};
var CATS=D.CATS,PROCS=D.PROCS,cur="all",q="";
function gc(id){for(var i=0;i<CATS.length;i++)if(CATS[i].id===id)return CATS[i];return{icon:"",label:"",color:"#374151",bg:"#f9fafb"};}
function x(s){return String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");}
function init(){
  var h='<button class="cb active" data-c="all">All</button>';
  for(var i=0;i<CATS.length;i++)h+='<button class="cb" data-c="'+CATS[i].id+'">'+CATS[i].icon+' '+x(CATS[i].label)+'</button>';
  document.getElementById("CB").innerHTML=h;
  document.getElementById("tP").textContent=PROCS.length;
  document.getElementById("tC").textContent=CATS.length;
  render();
}
function render(){
  var list=[],s=q.toLowerCase();
  for(var i=0;i<PROCS.length;i++){
    var p=PROCS[i];
    if(cur!=="all"&&p.cat!==cur)continue;
    if(s){var ok=p.title.toLowerCase().indexOf(s)>=0||(p.summary||"").toLowerCase().indexOf(s)>=0;if(!ok)continue;}
    list.push(p);
  }
  var ct=gc(cur);
  document.getElementById("PT").textContent=cur==="all"?"All Procedures":ct.label;
  document.getElementById("PC").innerHTML="Showing <b>"+list.length+"</b> procedure"+(list.length!==1?"s":"");
  if(!list.length){document.getElementById("G").innerHTML='<div class="nr">No results.</div>';return;}
  var h="";
  for(var i=0;i<list.length;i++){
    var p=list[i],c=gc(p.cat),sh="";
    for(var j=0;j<Math.min(3,p.steps.length);j++)sh+='<li><span class="sn" style="background:'+c.color+'">'+(j+1)+'</span><span>'+x(p.steps[j])+'</span></li>';
    if(p.steps.length>3)sh+='<li><span class="more" style="color:'+c.color+'">+'+(p.steps.length-3)+' more</span></li>';
    h+='<div class="card" data-id="'+p.id+'"><div class="ct" style="background:'+c.color+'"></div><div class="cb2"><div class="ch"><div class="ci2" style="background:'+c.bg+';color:'+c.color+'">'+p.icon+'</div><div><div class="ctt">'+x(p.title)+'</div><span class="ctag" style="background:'+c.bg+';color:'+c.color+'">'+c.icon+' '+x(c.label)+'</span></div></div><ul class="csteps">'+sh+'</ul><div class="cf"><span class="tag tg">Evidence-Based</span>'+(p.warnings&&p.warnings.length?'<span class="tag tr">Alerts</span>':'')+'<span class="tag tb">'+p.steps.length+' steps</span></div></div></div>';
  }
  document.getElementById("G").innerHTML=h;
}
document.addEventListener("click",function(e){
  var b=e.target.closest(".cb");
  if(b){var all=document.querySelectorAll(".cb");for(var i=0;i<all.length;i++)all[i].classList.remove("active");b.classList.add("active");cur=b.getAttribute("data-c");render();return;}
  var c=e.target.closest(".card");if(c){openM(+c.getAttribute("data-id"));return;}
  if(e.target.id==="OV"||e.target.id==="CL")closeM();
});
function openM(id){
  var p=null;for(var i=0;i<PROCS.length;i++)if(PROCS[i].id===id){p=PROCS[i];break;}if(!p)return;
  var c=gc(p.cat);
  document.getElementById("MI").textContent=p.icon;
  document.getElementById("MI").style.cssText="background:"+c.bg+";color:"+c.color;
  document.getElementById("MT").textContent=p.title;
  document.getElementById("MC").innerHTML='<span style="color:'+c.color+'">'+c.icon+' '+x(c.label)+'</span>';
  var h='<div class="ms"><div class="ib ibi">'+x(p.summary)+'</div></div>';
  if(p.equipment&&p.equipment.length){h+='<div class="ms"><div class="mst">Equipment</div><div class="eg">';for(var i=0;i<p.equipment.length;i++)h+='<span class="ec">'+x(p.equipment[i])+'</span>';h+='</div></div>';}
  h+='<div class="ms"><div class="mst">Steps</div><ol class="sol">';
  for(var i=0;i<p.steps.length;i++)h+='<li><span class="sc" style="background:'+c.color+'">'+(i+1)+'</span><span>'+x(p.steps[i])+'</span></li>';
  h+='</ol></div>';
  if(p.warnings&&p.warnings.length){h+='<div class="ms"><div class="mst">Warnings</div>';for(var i=0;i<p.warnings.length;i++)h+='<div class="ib ibw">'+x(p.warnings[i])+'</div>';h+='</div>';}
  if(p.notes&&p.notes.length){h+='<div class="ms"><div class="mst">Notes</div>';for(var i=0;i<p.notes.length;i++)h+='<div class="ib ibs">'+x(p.notes[i])+'</div>';h+='</div>';}
  if(p.refs&&p.refs.length){h+='<div class="ms"><div class="mst">References</div><div class="rb">';for(var i=0;i<p.refs.length;i++)h+='<div class="ri">'+x(p.refs[i])+'</div>';h+='</div></div>';}
  document.getElementById("MB").innerHTML=h;
  document.getElementById("OV").className="ov open";
  document.body.style.overflow="hidden";
  document.getElementById("OV").querySelector(".mo").scrollTop=0;
}
function closeM(){document.getElementById("OV").className="ov";document.body.style.overflow="";}
document.addEventListener("keydown",function(e){if(e.key==="Escape")closeM();});
document.getElementById("S").addEventListener("input",function(){q=this.value.trim();render();});
init();
</script>
